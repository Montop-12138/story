<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek 智能助手 · 手动同步版</title>
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(145deg, #f0f7ff 0%, #e6f0fa 50%, #dce8f5 100%);
            overflow: hidden;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            position: relative;
        }
        .header-fixed {
            flex-shrink: 0;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px 20px 0 0;
            padding: 6px 10px 4px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 16px;
            color: #ffffff;
            text-align: center;
            padding: 6px 12px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 40px;
            background: linear-gradient(135deg, #4facfe 0%, #00d4ff 45%, #56d4dd 80%, #a8d8ea 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.2);
        }
        h1::before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 10%;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 60px -30px 0 10px rgba(255, 255, 255, 0.1), 120px -10px 0 5px rgba(255, 255, 255, 0.15), 200px -40px 0 20px rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 20%;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: -80px -20px 0 15px rgba(255, 255, 255, 0.08), -150px -50px 0 8px rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }
        h1 .title-left {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            z-index: 1;
        }
        h1 .title-left .app-name {
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            font-size: 15px;
        }
        h1 .title-left .version-tag {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.2);
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 500;
        }
        .sync-badge {
            font-size: 8px;
            color: #fff;
            background: rgba(16, 185, 129, 0.8);
            padding: 1px 6px;
            border-radius: 8px;
            font-weight: 600;
            margin-left: 2px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .sync-badge:hover {
            transform: scale(1.05);
        }
        .sync-badge.offline {
            background: rgba(239, 68, 68, 0.8);
        }
        .sync-badge.syncing {
            background: rgba(251, 191, 36, 0.8);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .ds-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
        }
        .ds-icon span {
            font-size: 14px;
            font-weight: 800;
            background: linear-gradient(135deg, #4facfe 0%, #00d4ff 60%, #36d1dc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }
        .header-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .header-actions button {
            padding: 3px 10px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .header-actions button:active {
            transform: scale(0.95);
        }
        .btn-new {
            background: rgba(255, 255, 255, 0.15);
        }
        .toggle-collapse-btn {
            background: rgba(255, 255, 255, 0.1);
            font-size: 10px;
            padding: 3px 8px;
        }
        .btn-sync-manual {
            background: rgba(255, 255, 255, 0.25);
            font-size: 10px;
            padding: 3px 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .collapsible-section {
            transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.3s ease, padding 0.3s ease;
            max-height: 480px;
            opacity: 1;
            overflow: hidden;
            margin-bottom: 2px;
            padding: 0;
        }
        .collapsible-section.collapsed {
            max-height: 0 !important;
            opacity: 0;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden;
        }
        .collapsible-section.collapsed * {
            max-height: 0 !important;
            opacity: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            border: none !important;
        }
        .collapsible-section.collapsed .api-section {
            display: none !important;
        }
        .collapsible-section.collapsed .control-bar {
            display: none !important;
        }
        .collapsible-section.collapsed .share-bar {
            display: none !important;
        }
        .collapsible-section.collapsed .prompt-section {
            display: none !important;
        }
        .collapsed-mode h1 {
            padding: 4px 10px;
            min-height: 34px;
            font-size: 14px;
        }
        .api-section {
            display: flex;
            gap: 4px;
            padding: 4px 0;
            flex-shrink: 0;
        }
        .api-section input {
            flex: 1;
            padding: 5px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            font-size: 11px;
            outline: none;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            transition: all 0.3s;
            min-height: 30px;
        }
        .api-section input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.15);
            background: rgba(255, 255, 255, 0.8);
        }
        .api-section input::placeholder {
            color: rgba(0, 0, 0, 0.3);
            font-size: 11px;
        }
        .api-section button {
            padding: 5px 14px;
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
            transition: all 0.3s;
            white-space: nowrap;
            min-height: 30px;
        }
        .api-section button:active {
            transform: scale(0.97);
        }
        .control-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 8px;
            padding: 3px 0 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            font-size: 11px;
            color: #1a1a2e;
        }
        .control-bar .slider-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1 1 120px;
        }
        .control-bar .slider-group label {
            white-space: nowrap;
            font-weight: 500;
            font-size: 11px;
            color: rgba(0, 0, 0, 0.6);
        }
        .control-bar .slider-group input[type="range"] {
            flex: 1;
            min-width: 40px;
            accent-color: #4facfe;
            height: 3px;
            cursor: pointer;
        }
        .control-bar .slider-value {
            min-width: 26px;
            text-align: center;
            font-weight: 700;
            color: #4facfe;
            font-size: 11px;
        }
        .control-bar .rename-group {
            display: flex;
            align-items: center;
            gap: 3px;
            flex: 1 1 100px;
        }
        .control-bar .rename-group input {
            flex: 1;
            padding: 3px 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 11px;
            outline: none;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            min-height: 26px;
        }
        .control-bar .rename-group input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
            background: rgba(255, 255, 255, 0.7);
        }
        .control-bar .rename-group button {
            padding: 3px 10px;
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            min-height: 26px;
            white-space: nowrap;
        }
        .control-bar .rename-group button:active {
            transform: scale(0.95);
        }
        .prompt-section {
            padding: 4px 0;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .prompt-section .prompt-label {
            font-size: 10px;
            font-weight: 600;
            color: rgba(0, 0, 0, 0.5);
            display: block;
            margin-bottom: 2px;
        }
        .prompt-section .prompt-label .badge {
            display: inline-block;
            background: rgba(79, 172, 254, 0.15);
            color: #4facfe;
            font-size: 9px;
            padding: 0 6px;
            border-radius: 4px;
            margin-left: 4px;
        }
        .prompt-section .prompt-row {
            display: flex;
            gap: 4px;
        }
        .prompt-section .prompt-row textarea {
            flex: 1;
            padding: 4px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            font-size: 12px;
            font-family: inherit;
            outline: none;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            transition: all 0.3s;
            resize: none;
            min-height: 44px;
            max-height: 80px;
        }
        .prompt-section .prompt-row textarea:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
            background: rgba(255, 255, 255, 0.75);
        }
        .prompt-section .prompt-row textarea::placeholder {
            color: rgba(0, 0, 0, 0.25);
            font-size: 11px;
        }
        .prompt-section .prompt-row .prompt-actions {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex-shrink: 0;
        }
        .prompt-section .prompt-row .prompt-actions button {
            padding: 3px 12px;
            border: none;
            border-radius: 8px;
            font-size: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
            min-height: 22px;
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
        }
        .prompt-section .prompt-row .prompt-actions button:active {
            transform: scale(0.95);
        }
        .prompt-section .prompt-row .prompt-actions .btn-summary {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        .prompt-section .prompt-row .prompt-actions .btn-summary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .summary-display {
            padding: 4px 10px;
            background: rgba(79, 172, 254, 0.06);
            border-radius: 8px;
            font-size: 11px;
            color: rgba(0, 0, 0, 0.6);
            margin-top: 4px;
            border-left: 2px solid rgba(79, 172, 254, 0.2);
            line-height: 1.5;
            display: none;
        }
        .summary-display.has-summary {
            display: block;
        }
        .summary-display .summary-label {
            font-weight: 600;
            color: #4facfe;
            font-size: 10px;
            display: block;
            margin-bottom: 2px;
        }
        .summary-display textarea {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid rgba(79, 172, 254, 0.2);
            border-radius: 6px;
            font-size: 11px;
            font-family: inherit;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            resize: vertical;
            outline: none;
            transition: border 0.2s;
            max-height: 250px;
            min-height: 60px;
            overflow-y: auto;
            color: #1a1a2e;
        }
        .summary-display textarea:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
            background: rgba(255, 255, 255, 0.8);
        }
        .summary-display .summary-actions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            justify-content: flex-end;
        }
        .summary-display .summary-actions button {
            padding: 2px 14px;
            border: none;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            min-height: 22px;
        }
        .summary-display .summary-actions button:active {
            transform: scale(0.95);
        }
        .summary-display .summary-actions .btn-summary-cancel {
            background: rgba(0, 0, 0, 0.08);
            color: #555;
        }
        .summary-display .summary-actions .btn-summary-cancel:hover {
            background: rgba(0, 0, 0, 0.12);
        }
        .share-bar {
            display: flex;
            gap: 3px;
            padding: 3px 0 4px;
            flex-shrink: 0;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .share-bar button {
            padding: 3px 8px;
            border: none;
            border-radius: 8px;
            font-size: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            white-space: nowrap;
            min-height: 24px;
        }
        .share-bar button:active {
            transform: scale(0.95);
        }
        .share-bar .btn-copy {
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border: none;
        }
        .share-bar .btn-copy-all {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border: none;
        }
        .share-bar .btn-export {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            border: none;
        }
        .share-bar .btn-select-mode {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            border: none;
        }
        .share-bar .btn-select-mode.active {
            background: linear-gradient(135deg, #f5576c, #ff6b6b);
        }
        .share-bar .select-info {
            font-size: 10px;
            color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 3px;
            background: rgba(255, 255, 255, 0.4);
            padding: 2px 8px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        .share-bar .select-info input[type="checkbox"] {
            accent-color: #4facfe;
            width: 12px;
            height: 12px;
            cursor: pointer;
        }
        .share-bar .select-info .copy-selected-btn {
            padding: 2px 8px;
            font-size: 9px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .session-bar {
            display: flex;
            gap: 3px;
            padding: 4px 0 6px;
            flex-shrink: 0;
            overflow-x: auto;
            flex-wrap: nowrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2px;
        }
        .session-bar::-webkit-scrollbar {
            height: 2px;
        }
        .session-bar::-webkit-scrollbar-thumb {
            background: rgba(79, 172, 254, 0.3);
            border-radius: 10px;
        }
        .session-tab {
            padding: 3px 12px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            color: rgba(0, 0, 0, 0.6);
            transition: all 0.25s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .session-tab.active {
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
        }
        .session-tab .del-session {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 10px;
            opacity: 0.5;
            padding: 0 2px;
        }
        .session-tab .del-session:hover {
            opacity: 1;
        }
        .session-tab .summary-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4facfe;
            margin-left: 2px;
        }
        .btn-add-session {
            padding: 3px 10px;
            background: rgba(79, 172, 254, 0.1);
            color: #4facfe;
            border: 1px dashed rgba(79, 172, 254, 0.3);
            border-radius: 16px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .btn-add-session:hover {
            background: rgba(79, 172, 254, 0.2);
        }
        .btn-add-session:active {
            transform: scale(0.95);
        }
        .chat-scroll-area {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding: 8px 4px 4px 4px;
            margin: 2px 0;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            -webkit-overflow-scrolling: touch;
        }
        .chat-scroll-area::-webkit-scrollbar {
            width: 3px;
        }
        .chat-scroll-area::-webkit-scrollbar-thumb {
            background: rgba(79, 172, 254, 0.3);
            border-radius: 10px;
        }
        .chat-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 100%;
        }
        .message-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 100%;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }
        .message-wrapper.user-wrapper {
            align-items: flex-end;
        }
        .message-wrapper .msg-actions {
            display: flex;
            gap: 4px;
            margin-top: 3px;
            font-size: 10px;
            flex-wrap: wrap;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .message-wrapper .msg-actions:hover {
            opacity: 1;
        }
        .message-wrapper .msg-actions button {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 5px;
            padding: 1px 8px;
            font-size: 10px;
            cursor: pointer;
            color: #555;
            transition: all 0.2s;
            font-weight: 500;
        }
        .message-wrapper .msg-actions button:hover {
            background: white;
            transform: scale(1.05);
        }
        .message-wrapper .msg-actions .del-msg-btn {
            color: #dc2626;
        }
        .message-wrapper .msg-actions .del-msg-btn:hover {
            background: #fee2e2;
        }
        .message-wrapper .msg-actions .edit-msg-btn {
            color: #4facfe;
        }
        .message-wrapper .msg-actions .edit-msg-btn:hover {
            background: #dbe4fe;
        }
        .message-wrapper .msg-actions .refresh-btn {
            color: #f59e0b;
        }
        .message-wrapper .msg-actions .refresh-btn:hover {
            background: #fef3c7;
        }
        .message-wrapper .msg-actions .expand-btn {
            color: #8b5cf6;
        }
        .message-wrapper .msg-actions .expand-btn:hover {
            background: #ede9fe;
        }
        .message-wrapper.select-mode .msg-actions {
            display: none !important;
        }
        .message-wrapper .msg-checkbox {
            display: none;
            margin-right: 4px;
            align-self: center;
            accent-color: #4facfe;
            width: 14px;
            height: 14px;
        }
        .message-wrapper.select-mode .msg-checkbox {
            display: inline-block;
        }
        .message-wrapper.select-mode {
            flex-direction: row;
            align-items: center;
            gap: 3px;
        }
        .message-wrapper.select-mode .message {
            flex: 1;
        }
        .message {
            max-width: 85%;
            padding: 8px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.55) 0%, rgba(0, 210, 255, 0.4) 60%, rgba(79, 210, 240, 0.2) 100%);

    <script>
        const DEFAULT_SYSTEM_PROMPT =
            '你是一个沉浸式文字游戏的主持人。请根据用户提供的设定和对话历史，自然地推动剧情发展。每次回复控制在 500 字以内，不要超过。';

        const COMPRESS_CONFIG = {
            TRIGGER_COUNT: 12,
            KEEP_RECENT: 6,
            SUMMARY_MAX_WORDS: 3000
        };

        let API_KEY = localStorage.getItem('deepseek_api_key') || '';
        let sessions = [];
        let currentSessionId = null;
        let isCollapsed = false;
        let selectMode = false;
        let selectedIndices = new Set();
        let isCloudReady = false;
        let isSyncing = false;
        let touchMessageIndex = null;
        let isCompressing = false;
        let expandedText = null;
        let isEditingSummary = false;

        const COLLECTION_NAME = 'conversations_v9';

        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const chatBox = document.getElementById('chatBox');
        const chatScrollArea = document.getElementById('chatScrollArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusTip = document.getElementById('statusTip');
        const toast = document.getElementById('toast');
        const sessionBar = document.getElementById('sessionBar');
        const toggleBtn = document.getElementById('toggleCollapseBtn');
        const collapsibleSection = document.getElementById('collapsibleSection');
        const syncBadge = document.getElementById('syncBadge');
        const manualSyncBtn = document.getElementById('manualSyncBtn');
        const syncDot = document.getElementById('syncDot');
        const syncText = document.getElementById('syncText');
        const tokenInfo = document.getElementById('tokenInfo');
        const expandIndicator = document.getElementById('expandIndicator');

        const maxTokensSlider = document.getElementById('maxTokensSlider');
        const maxTokensDisplay = document.getElementById('maxTokensDisplay');
        const renameInput = document.getElementById('renameInput');
        const renameBtn = document.getElementById('renameBtn');

        const systemPromptInput = document.getElementById('systemPromptInput');
        const savePromptBtn = document.getElementById('savePromptBtn');
        const manualSummaryBtn = document.getElementById('manualSummaryBtn');

        const summaryDisplay = document.getElementById('summaryDisplay');
        const summaryTextarea = document.getElementById('summaryTextarea');
        const summarySaveBtn = document.getElementById('summarySaveBtn');
        const summaryCancelBtn = document.getElementById('summaryCancelBtn');

        const copyLastBtn = document.getElementById('copyLastBtn');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const exportBtn = document.getElementById('exportBtn');
        const selectModeBtn = document.getElementById('selectModeBtn');
        const selectInfo = document.getElementById('selectInfo');
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        const selectedCount = document.getElementById('selectedCount');
        const copySelectedBtn = document.getElementById('copySelectedBtn');
        const newSessionBtn = document.getElementById('newSessionBtn');

        let toastTimer = null;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 2500);
        }

        function generateId() {
            return Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 4);
        }

        function getSessionNameFromMessages(messages) {
            for (var i = 0; i < messages.length; i++) {
                if (messages[i].role === 'user') {
                    var txt = messages[i].content.replace(/\n/g, ' ').trim();
                    return txt.length > 15 ? txt.substring(0, 15) + '…' : txt;
                }
            }
            return '新对话';
        }

        function getCurrentSession() {
            for (var i = 0; i < sessions.length; i++) {
                if (sessions[i].id === currentSessionId) return sessions[i];
            }
            return sessions[0];
        }

        function countUserAssistantMessages(messages) {
            var count = 0;
            for (var i = 0; i < messages.length; i++) {
                if (messages[i].role === 'user' || messages[i].role === 'assistant') {
                    count++;
                }
            }
            return count;
        }

        function setSyncStatus(status) {
            syncDot.className = 'sync-dot';
            if (status === 'synced') {
                syncDot.className = 'sync-dot';
                syncText.textContent = '已同步';
                syncBadge.textContent = '☁️ 云端';
                syncBadge.className = 'sync-badge';
            } else if (status === 'syncing') {
                syncDot.className = 'sync-dot syncing';
                syncText.textContent = '同步中...';
                syncBadge.textContent = '⏳ 同步中';
                syncBadge.className = 'sync-badge syncing';
            } else if (status === 'error') {
                syncDot.className = 'sync-dot error';
                syncText.textContent = '同步失败';
                syncBadge.textContent = '⚠️ 同步失败';
                syncBadge.className = 'sync-badge offline';
            } else if (status === 'offline') {
                syncDot.className = 'sync-dot error';
                syncText.textContent = '离线模式';
                syncBadge.textContent = '📡 离线';
                syncBadge.className = 'sync-badge offline';
            } else if (status === 'manual') {
                syncDot.className = 'sync-dot';
                syncText.textContent = '手动同步';
                syncBadge.textContent = '🔄 手动';
                syncBadge.className = 'sync-badge';
            }
        }

        const ENV_ID = 'deepseek-chat-d5gg0748z3b9dfe24';
        let cloudApp = null;
        let cloudDb = null;

        async function initCloud() {
            try {
                if (typeof cloudbase === 'undefined') {
                    console.error('❌ cloudbase SDK 未加载');
                    isCloudReady = false;
                    setSyncStatus('offline');
                    return false;
                }
                cloudApp = cloudbase.init({ env: ENV_ID });
                const auth = cloudApp.auth();
                const loginState = await auth.getLoginState();
                if (!loginState) {
                    await auth.anonymousAuthProvider().signIn();
                }
                cloudDb = cloudApp.database();
                isCloudReady = true;
                setSyncStatus('manual');
                console.log('✅ 云端初始化成功（手动同步模式）');
                return true;
            } catch (e) {
                console.error('❌ 云端初始化失败:', e);
                isCloudReady = false;
                setSyncStatus('offline');
                return false;
            }
        }

        async function loadFromCloud() {
            if (!isCloudReady || !cloudDb) return null;
            try {
                const res = await cloudDb.collection(COLLECTION_NAME)
                    .orderBy('updateTime', 'desc')
                    .limit(100)
                    .get();
                if (res.data && res.data.length > 0) {
                    return res.data.map(item => ({
                        id: item.id,
                        name: item.name || '新对话',
                        systemPrompt: item.systemPrompt || DEFAULT_SYSTEM_PROMPT,
                        summary: item.summary || '',
                        messages: item.messages || [],
                        createTime: item.createTime || new Date().toISOString(),
                        updateTime: item.updateTime || new Date().toISOString(),
                        _cloudId: item._id
                    }));
                }
                return [];
            } catch (e) {
                console.error('❌ 拉取云端数据失败:', e);
                return null;
            }
        }

        async function syncToCloud(sessionsData) {
            if (!isCloudReady || !cloudDb) return false;
            if (isSyncing) return false;
            try {
                isSyncing = true;
                setSyncStatus('syncing');
                const collection = cloudDb.collection(COLLECTION_NAME);
                const existing = await collection.limit(100).get();
                var existingData = [];
                if (existing && existing.data && Array.isArray(existing.data)) {
                    existingData = existing.data;
                }
                for (const item of existingData) {
                    try {
                        if (item._id) {
                            await collection.doc(item._id).remove();
                        }
                    } catch (e) {
                        console.warn('删除旧数据失败:', e);
                    }
                }
                for (const session of sessionsData) {
                    await collection.add({
                        id: session.id,
                        name: session.name || '新对话',
                        systemPrompt: session.systemPrompt || DEFAULT_SYSTEM_PROMPT,
                        summary: session.summary || '',
                        messages: session.messages || [],
                        createTime: session.createTime || new Date().toISOString(),
                        updateTime: session.updateTime || new Date().toISOString()
                    });
                }
                setSyncStatus('manual');
                isSyncing = false;
                return true;
            } catch (e) {
                console.error('❌ 同步到云端失败:', e);
                setSyncStatus('error');
                isSyncing = false;
                return false;
            }
        }

        function createSession(name, systemPrompt) {
            return {
                id: generateId(),
                name: name || '新对话',
                systemPrompt: systemPrompt || DEFAULT_SYSTEM_PROMPT,
                summary: '',
                messages: [],
                createTime: new Date().toISOString(),
                updateTime: new Date().toISOString()
            };
        }

        function saveSessionsToLocal() {
            localStorage.setItem('deepseek_sessions_v9', JSON.stringify(sessions));
            if (currentSessionId) {
                localStorage.setItem('deepseek_current_session_v9', currentSessionId);
            }
        }

        function loadSessionsFromLocal() {
            var data = localStorage.getItem('deepseek_sessions_v9');
            if (data) {
                try { sessions = JSON.parse(data); } catch (e) { sessions = []; }
            } else { sessions = []; }

            for (var i = 0; i < sessions.length; i++) {
                if (!sessions[i].systemPrompt) {
                    sessions[i].systemPrompt = DEFAULT_SYSTEM_PROMPT;
                }
                if (sessions[i].summary === undefined) {
                    sessions[i].summary = '';
                }
            }

            if (sessions.length === 0) {
                var s = createSession('对话 1', DEFAULT_SYSTEM_PROMPT);
                sessions.push(s);
            }

            var savedCurrent = localStorage.getItem('deepseek_current_session_v9');
            if (savedCurrent) {
                var found = false;
                for (var i = 0; i < sessions.length; i++) {
                    if (sessions[i].id === savedCurrent) { found = true; break; }
                }
                currentSessionId = found ? savedCurrent : sessions[0].id;
            } else {
                currentSessionId = sessions[0].id;
            }
        }

        async function manualSync() {
            if (!isCloudReady) {
                showToast('云端未连接，尝试初始化...');
                await initCloud();
                if (!isCloudReady) {
                    showToast('❌ 云端连接失败');
                    return;
                }
            }

            showToast('🔄 正在同步...');
            setSyncStatus('syncing');

            await syncToCloud(sessions);

            const cloudData = await loadFromCloud();

            if (cloudData !== null && cloudData.length > 0) {
                var mergedSessions = mergeSessions(sessions, cloudData);
                sessions = mergedSessions;

                if (!currentSessionId || !sessions.some(s => s.id === currentSessionId)) {
                    currentSessionId = sessions[0].id;
                }
                saveSessionsToLocal();
                renderAll();
                showToast('✅ 同步完成！');
                setSyncStatus('manual');
            } else if (cloudData !== null && cloudData.length === 0) {
                showToast('✅ 已同步到云端');

        function mergeSessions(localSessions, cloudSessions) {
            var merged = [];
            var localMap = {};
            var cloudMap = {};

            for (var i = 0; i < localSessions.length; i++) {
                localMap[localSessions[i].id] = localSessions[i];
            }
            for (var i = 0; i < cloudSessions.length; i++) {
                cloudMap[cloudSessions[i].id] = cloudSessions[i];
            }

            var allIds = new Set();
            for (var id in localMap) { allIds.add(id); }
            for (var id in cloudMap) { allIds.add(id); }

            for (var id of allIds) {
                var local = localMap[id];
                var cloud = cloudMap[id];

                if (local && cloud) {
                    var localMsgIds = new Set();
                    for (var i = 0; i < local.messages.length; i++) {
                        localMsgIds.add(local.messages[i].timestamp || i);
                    }
                    var mergedMsg = local.messages.slice();
                    for (var i = 0; i < cloud.messages.length; i++) {
                        var msgId = cloud.messages[i].timestamp || i;
                        if (!localMsgIds.has(msgId)) {
                            mergedMsg.push(cloud.messages[i]);
                        }
                    }
                    mergedMsg.sort(function(a, b) {
                        return (a.timestamp || 0) - (b.timestamp || 0);
                    });

                    merged.push({
                        id: local.id,
                        name: local.name || cloud.name || '新对话',
                        systemPrompt: local.systemPrompt || cloud.systemPrompt || DEFAULT_SYSTEM_PROMPT,
                        summary: local.summary || cloud.summary || '',
                        messages: mergedMsg,
                        createTime: local.createTime || cloud.createTime || new Date().toISOString(),
                        updateTime: new Date().toISOString()
                    });
                } else if (local) {
                    merged.push(local);
                } else if (cloud) {
                    merged.push(cloud);
                }
            }

            return merged;
        }

            var msg = session.messages[index];
            if (msg.role !== 'assistant') {
                showToast('只能刷新 AI 的回复');
                return;
            }

            var userIndex = -1;
            for (var i = index - 1; i >= 0; i--) {
                if (session.messages[i].role === 'user') {
                    userIndex = i;
                    break;
                }
            }
            if (userIndex === -1) {
                showToast('没有找到对应的用户消息');
                return;
            }

            var userMsg = session.messages[userIndex];
            var userContent = userMsg.content;

            session.messages.splice(index, session.messages.length - index);
            session.summary = '';
            saveSessionsToLocal();
            renderAll();

            showToast('🔄 正在重新生成...');

            setTimeout(function() {
                sendMessage(userContent, true);
            }, 200);

            saveSessionsToLocal();
            renderAll();
            sendBtn.disabled = true;

            try {
                var maxTokens = parseInt(maxTokensSlider.value) || 1000;
                var contextMessages = [];

                var systemPrompt = session.systemPrompt || DEFAULT_SYSTEM_PROMPT;
                contextMessages.push({ role: 'system', content: systemPrompt });

                if (session.summary && session.summary.length > 0) {
                    contextMessages.push({
                        role: 'system',
                        content: '【当前剧情摘要】\n' + session.summary + '\n（请基于以上摘要和后续对话继续推进剧情）'
                    });
                }

                var historyMsgs = [];
                for (var i = 0; i < session.messages.length; i++) {
                    var m = session.messages[i];
                    if (m.role === 'user' || m.role === 'assistant') {
                        historyMsgs.push(m);
                    }
                }

                var recentMsgs = historyMsgs.slice(-COMPRESS_CONFIG.KEEP_RECENT);
                var msgsToSend = historyMsgs.length <= COMPRESS_CONFIG.KEEP_RECENT ?
                    historyMsgs :
                    recentMsgs;

                for (var i = 0; i < msgsToSend.length; i++) {
                    contextMessages.push({
                        role: msgsToSend[i].role,
                        content: msgsToSend[i].content
                    });
                }

                console.log('📤 上下文构建: 设定=' + (systemPrompt.length) + '字, 摘要=' + (session.summary ? session.summary
                    .length : 0) + '字, 消息数=' + msgsToSend.length);

                var response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + key
                    },
                    body: JSON.stringify({
                        model: 'deepseek-v4-flash',
                        messages: contextMessages,
                        max_tokens: maxTokens,
                        temperature: 0.8
                    })
                });

                var data = await response.json();

                var newMsgs2 = [];
                for (var j = 0; j < session.messages.length; j++) {
                    if (session.messages[j].role !== 'loading') newMsgs2.push(session.messages[j]);
                }
                session.messages = newMsgs2;

                if (!response.ok) {
                    var errMsg = data.error ? data.error.message : '请求失败';
                    throw new Error('错误 ' + response.status + ': ' + errMsg);
                }

                if (data.choices && data.choices[0]) {
                    var reply = data.choices[0].message.content;
                    session.messages.push({ role: 'assistant', content: reply, timestamp: new Date().toISOString() });
                    if (session.name === '新对话' && session.messages.length > 0) {
                        session.name = getSessionNameFromMessages(session.messages);
                    }
                    session.updateTime = new Date().toISOString();
                    saveSessionsToLocal();
                    renderAll();

                    checkAndCompress();

                } else {
                    throw new Error('API 返回异常');
                }

            } catch (error) {
                var newMsgs3 = [];
                for (var k = 0; k < session.messages.length; k++) {
                    if (session.messages[k].role !== 'loading') newMsgs3.push(session.messages[k]);
                }
                session.messages = newMsgs3;

                var errorText = '❌ ' + error.message;
                if (error.message.includes('401') || error.message.includes('403')) {
                    errorText = '❌ API Key 无效，请重新输入';
                    localStorage.removeItem('deepseek_api_key');
                    API_KEY = '';
                    enableChat(false);
                    apiKeyInput.value = '';
                } else if (error.message.includes('Failed to fetch')) {
                    errorText = '❌ 网络连接失败';
                }
                session.messages.push({ role: 'error', content: errorText });
                session.updateTime = new Date().toISOString();
                saveSessionsToLocal();
                renderAll();
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
                forceEnableInput();
            }
        }

        function deleteMessage(index) {
            var session = getCurrentSession();
            if (!session) return;
            if (index < 0 || index >= session.messages.length) return;
            var msg = session.messages[index];
            if (msg.role === 'loading' || msg.role === 'error') return;

            var deleteCount = 1;
            if (msg.role === 'user') {
                var nextIndex = index + 1;
                while (nextIndex < session.messages.length) {
                    var nextMsg = session.messages[nextIndex];
                    if (nextMsg.role === 'user') break;
                    deleteCount++;
                    nextIndex++;
                }
            }

            if (!confirm('确定删除这条消息' + (deleteCount > 1 ? '及其后续回复' : '') + '吗？')) return;
            clearExpandIndicator();
            session.messages.splice(index, deleteCount);
            session.updateTime = new Date().toISOString();
            session.summary = '';
            saveSessionsToLocal();
            renderAll();
            showToast('已删除，摘要已重置');
        }

        function startEditMessage(index) {
            var session = getCurrentSession();
            if (!session) return;
            if (index < 0 || index >= session.messages.length) return;
            var msg = session.messages[index];
            if (msg.role === 'error' || msg.role === 'loading' || msg.role === 'assistant') {
                showToast('只能编辑用户消息');
                return;
            }

            var wrappers = chatBox.querySelectorAll('.message-wrapper');
            if (index < wrappers.length) {
                var wrapper = wrappers[index];
                var msgDiv = wrapper.querySelector('.message');
                if (msgDiv) {
                    document.querySelectorAll('.message.edit-mode').forEach(function(el) {
                        el.classList.remove('edit-mode');
                    });
                    msgDiv.classList.add('edit-mode');
                    var textarea = msgDiv.querySelector('.edit-textarea');
                    if (textarea) {
                        textarea.value = msg.content;
                        textarea.focus();
                        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
                    }
                }
            }
        }

        function saveEditMessage(index) {
            var session = getCurrentSession();
            if (!session) return;
            if (index < 0 || index >= session.messages.length) return;
            var msg = session.messages[index];

            var wrappers = chatBox.querySelectorAll('.message-wrapper');
            if (index < wrappers.length) {
                var wrapper = wrappers[index];
                var msgDiv = wrapper.querySelector('.message');
                if (msgDiv) {
                    var textarea = msgDiv.querySelector('.edit-textarea');
                    if (textarea) {
                        var newContent = textarea.value.trim();
                        if (!newContent) { showToast('内容不能为空'); return; }
                        msg.content = newContent;
                        msgDiv.classList.remove('edit-mode');

                        var nextIndex = index + 1;
                        if (nextIndex < session.messages.length) {
                            session.messages.splice(nextIndex);
                        }

                        session.updateTime = new Date().toISOString();
                        session.summary = '';
                        saveSessionsToLocal();
                        renderAll();
                        showToast('✅ 已修改，摘要已重置');

                        setTimeout(function() {
                            sendMessage(newContent, true);
                        }, 200);
                    }
                }
            }
        }

        function cancelEditMessage() {
            document.querySelectorAll('.message.edit-mode').forEach(function(el) {
                el.classList.remove('edit-mode');
            });
        }

        function toggleTouchActions(index) {
            var wrappers = chatBox.querySelectorAll('.message-wrapper');
            for (var i = 0; i < wrappers.length; i++) {
                if (i !== index) {
                    wrappers[i].classList.remove('touch-show');
                }
            }
            if (index >= 0 && index < wrappers.length) {
                var wrapper = wrappers[index];
                var msg = getCurrentSession().messages[index];
                if (msg && msg.role !== 'loading' && msg.role !== 'error') {
                    wrapper.classList.toggle('touch-show');
                }
            }
        }

        function exitSelectMode() {
            selectMode = false;
            selectedIndices.clear();
            selectModeBtn.textContent = '☑️ 选择';
            selectModeBtn.classList.remove('active');
            selectInfo.style.display = 'none';
        }

        function toggleSelectMessage(index) {
            if (!selectMode) return;
            var session = getCurrentSession();
            if (!session) return;
            var msg = session.messages[index];
            if (msg.role === 'error' || msg.role === 'loading') return;
            if (selectedIndices.has(index)) {
                selectedIndices.delete(index);
            } else {
                selectedIndices.add(index);
            }
            updateSelectedCount();
            renderChat();
        }

        function updateSelectedCount() {
            selectedCount.textContent = selectedIndices.size + '条';
            var session = getCurrentSession();
            if (session) {
                var total = 0;
                for (var i = 0; i < session.messages.length; i++) {
                    var m = session.messages[i];
                    if (m.role !== 'error' && m.role !== 'loading') total++;
                }
                selectAllCheckbox.checked = selectedIndices.size === total && total > 0;
            }
        }

        function selectAllMessages() {
            var session = getCurrentSession();
            if (!session) return;
            var allChecked = selectAllCheckbox.checked;
            selectedIndices.clear();
            if (allChecked) {
                for (var i = 0; i < session.messages.length; i++) {
                    var m = session.messages[i];
                    if (m.role !== 'error' && m.role !== 'loading') {
                        selectedIndices.add(i);
                    }
                }
            }
            updateSelectedCount();
            renderChat();
        }

        function getSelectedText() {
            var session = getCurrentSession();
            if (!session) return '';
            var sorted = Array.from(selectedIndices).sort(function(a, b) { return a - b; });
            var text = '📝 ' + session.name + '\n' + '='.repeat(40) + '\n\n';
            for (var i = 0; i < sorted.length; i++) {
                var idx = sorted[i];
                var msg = session.messages[idx];
                if (msg) {
                    var label = msg.role === 'user' ? '👤 用户' : '🤖 AI';
                    text += '【' + label + '】\n' + msg.content + '\n\n';
                }
            }
            return text;
        }

        function getAllText() {
            var session = getCurrentSession();
            if (!session) return '';
            var text = '📝 ' + session.name + '\n';
            text += '📜 设定: ' + session.systemPrompt + '\n';
            if (session.summary) {
                text += '📌 摘要: ' + session.summary + '\n';
            }
            text += '='.repeat(40) + '\n\n';
            for (var i = 0; i < session.messages.length; i++) {
                var msg = session.messages[i];
                if (msg.role === 'error' || msg.role === 'loading') continue;
                var label = msg.role === 'user' ? '👤 用户' : '🤖 AI';
                text += '【' + label + '】\n' + msg.content + '\n\n';
            }
            return text;
        }

        function getLastReply() {
            var session = getCurrentSession();
            if (!session) return '';
            for (var i = session.messages.length - 1; i >= 0; i--) {
                if (session.messages[i].role === 'assistant') {
                    return session.messages[i].content;
                }
            }
            return '';
        }

        function copyToClipboard(text) {
            if (!text) { showToast('没有内容可复制'); return; }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showToast('✅ 已复制到剪贴板');
                }).catch(function() {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✅ 已复制到剪贴板');
            } catch (e) {
                showToast('❌ 复制失败');
            }
            document.body.removeChild(textarea);
        }

        function forceEnableInput() {
            if (userInput) {
                userInput.disabled = false;
                userInput.style.opacity = '1';
                userInput.style.pointerEvents = 'auto';
            }
            if (sendBtn) {
                sendBtn.disabled = false;
            }
            if (userInput) {
                userInput.focus();
            }
        }

        saveKeyBtn.addEventListener('click', function() {
            var key = apiKeyInput.value.trim();
            if (!key) { showToast('请输入 API Key'); return; }
            if (!key.startsWith('sk-')) { showToast('格式错误，应以 sk- 开头'); return; }
            API_KEY = key;
            localStorage.setItem('deepseek_api_key', key);
            enableChat(true);
            var session = getCurrentSession();
            if (session) {
                var newMsgs = [];
                for (var i = 0; i < session.messages.length; i++) {
                    if (session.messages[i].role !== 'error') newMsgs.push(session.messages[i]);
                }
                session.messages = newMsgs;
                if (session.messages.length === 0) {
                    session.messages.push({ role: 'assistant', content: '✅ API Key 已保存！请设定你的剧本。' });
                } else {
                    session.messages.push({ role: 'assistant', content: '✅ API Key 已更新！' });
                }
                session.updateTime = new Date().toISOString();
                saveSessionsToLocal();
                renderAll();
            }
            showToast('✅ API Key 已保存');
            forceEnableInput();
        });

        toggleBtn.addEventListener('click', function() {
            isCollapsed = !isCollapsed;
            if (isCollapsed) {
                collapsibleSection.classList.add('collapsed');
                toggleBtn.textContent = '⬇ 展开';
                document.body.classList.add('collapsed-mode');
            } else {
                collapsibleSection.classList.remove('collapsed');
                toggleBtn.textContent = '⬆ 收起';
                document.body.classList.remove('collapsed-mode');
            }
        });

        savePromptBtn.addEventListener('click', saveSystemPrompt);

        manualSummaryBtn.addEventListener('click', function() {
            var session = getCurrentSession();
            if (!session) { showToast('请先创建对话'); return; }
            var msgCount = countUserAssistantMessages(session.messages);
            if (msgCount < 4) {
                showToast('对话太短，至少 4 条消息后才能总结');
                return;
            }
            generateSummary(true);
        });

        systemPromptInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                saveSystemPrompt();
            }
        });

        summarySaveBtn.addEventListener('click', saveSummaryFromTextarea);

        summaryCancelBtn.addEventListener('click', cancelSummaryEdit);

        summaryTextarea.addEventListener('focus', function() {
            isEditingSummary = true;
            summaryCancelBtn.style.display = 'inline-block';
        });

        summaryTextarea.addEventListener('blur', function() {
            setTimeout(function() {
                if (!isEditingSummary) {
                    summaryCancelBtn.style.display = 'none';
                }
            }, 200);
        });

        summaryTextarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                saveSummaryFromTextarea();
            }
        });

        renameBtn.addEventListener('click', function() {
            var newName = renameInput.value.trim();
            if (!newName) { showToast('请输入名称'); return; }
            renameCurrentSession(newName);
        });
        renameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault();
                renameBtn.click(); }
        });

        maxTokensSlider.addEventListener('input', function() {
            maxTokensDisplay.textContent = this.value;
            localStorage.setItem('deepseek_max_tokens', this.value);
        });
        var savedMaxTokens = localStorage.getItem('deepseek_max_tokens');
        if (savedMaxTokens) {
            maxTokensSlider.value = savedMaxTokens;
            maxTokensDisplay.textContent = savedMaxTokens;
        }

        copyLastBtn.addEventListener('click', function() {
            var text = getLastReply();
            copyToClipboard(text || '没有找到回复');
        });
        copyAllBtn.addEventListener('click', function() {
            var text = getAllText();
            copyToClipboard(text || '没有内容');
        });
        exportBtn.addEventListener('click', function() {
            var text = getAllText();
            if (!text) { showToast('没有内容可导出'); return; }
            var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            var session = getCurrentSession();
            link.download = (session ? session.name : '对话') + '.txt';
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('✅ 导出成功');
        });

        selectModeBtn.addEventListener('click', function() {
            selectMode = !selectMode;
            if (selectMode) {
                selectedIndices.clear();
                selectModeBtn.textContent = '❌ 退出';
                selectModeBtn.classList.add('active');
                selectInfo.style.display = 'flex';
                selectAllCheckbox.checked = false;
                selectedCount.textContent = '0条';
            } else {
                exitSelectMode();
            }
            renderChat();
        });
        selectAllCheckbox.addEventListener('change', selectAllMessages);
        copySelectedBtn.addEventListener('click', function() {
            var text = getSelectedText();
            copyToClipboard(text || '请先选择消息');
        });

        sendBtn.addEventListener('click', function() {
            if (expandedText) {
                clearExpandIndicator();
            }
            sendMessage();
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (expandedText) {
                    clearExpandIndicator();
                }
                sendMessage();
            }
        });
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 80) + 'px';
            if (expandedText && this.value !== expandedText) {
                clearExpandIndicator();
            }
        });

        newSessionBtn.addEventListener('click', addNewSession);

        manualSyncBtn.addEventListener('click', manualSync);

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.message-wrapper') && !e.target.closest('.msg-actions')) {
                document.querySelectorAll('.message-wrapper.touch-show').forEach(function(el) {
                    el.classList.remove('touch-show');
                });
            }
        });

        async function init() {
            await initCloud();

            loadSessionsFromLocal();

            if (!currentSessionId || !sessions.some(s => s.id === currentSessionId)) {
                currentSessionId = sessions[0].id;
            }

            if (API_KEY) {
                apiKeyInput.value = API_KEY;
                enableChat(true);
            } else {
                enableChat(false);
                apiKeyInput.focus();
            }

            renderAll();
            forceEnableInput();

            if (isCloudReady) {
                const cloudData = await loadFromCloud();
                if (cloudData !== null && cloudData.length > 0) {
                    var mergedSessions = mergeSessions(sessions, cloudData);
                    sessions = mergedSessions;
                    if (!currentSessionId || !sessions.some(s => s.id === currentSessionId)) {
                        currentSessionId = sessions[0].id;
                    }
                    saveSessionsToLocal();
                    renderAll();
                }
            }

            console.log('✅ 初始化完成（index9 - 最终优化版）');
            console.log('📊 压缩阈值: ' + COMPRESS_CONFIG.TRIGGER_COUNT + ' 条消息');
            console.log('📊 保留最近: ' + COMPRESS_CONFIG.KEEP_RECENT + ' 条消息');
            console.log('📊 摘要上限: ' + COMPRESS_CONFIG.SUMMARY_MAX_WORDS + ' 字');
        }

        init();

        window.sendMessage = sendMessage;
        window.generateSummary = generateSummary;
        window.forceEnableInput = forceEnableInput;
        window.refreshMessage = refreshMessage;
        window.expandMessage = expandMessage;
        window.manualSync = manualSync;
        window.COMPRESS_CONFIG = COMPRESS_CONFIG;
    </script>
</body>
</html>
