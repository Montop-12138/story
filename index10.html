function checkAndCompress(){let session=getCurrentSession();if(!session)return;let msgCount=countUserAssistantMessages(session.messages),now=Date.now();if(now-LAST_COMPRESS_TIME<COMPRESS_COOLDOWN){console.log('⏳ 摘要冷却中，跳过自动压缩');return;}if(msgCount>=COMPRESS_CONFIG.TRIGGER_COUNT&&lastCompressCount===0){console.log('🔄 首次触发自动压缩，消息数: '+msgCount);lastCompressCount=msgCount;localStorage.setItem('lastCompressCount_v9',String(lastCompressCount));LAST_COMPRESS_TIME=now;setTimeout(()=>{generateSummary('incremental',!1);},500);return;}if(lastCompressCount>0&&msgCount-lastCompressCount>=COMPRESS_CONFIG.TRIGGER_INTERVAL){console.log('🔄 触发摘要更新，消息数: '+msgCount);lastCompressCount=msgCount;localStorage.setItem('lastCompressCount_v9',String(lastCompressCount));LAST_COMPRESS_TIME=now;setTimeout(()=>{generateSummary('incremental',!1);},500);return;}if(msgCount>=COMPRESS_CONFIG.TRIGGER_COUNT&&(!session.summary||session.summary.length===0)){console.log('🔄 摘要为空，强制压缩');lastCompressCount=msgCount;localStorage.setItem('lastCompressCount_v9',String(lastCompressCount));LAST_COMPRESS_TIME=now;setTimeout(()=>{generateSummary('incremental',!1);},500);}}
async function refreshMessage(index){let session=getCurrentSession();if(!session){showToast('请先创建对话');return;}if(index<0||index>=session.messages.length)return;let msg=session.messages[index];if(msg.role!=='assistant'){showToast('只能刷新 AI 的回复');return;}let userIndex=-1;for(let i=index-1;i>=0;i--){if(session.messages[i].role==='user'){userIndex=i;break;}}if(userIndex===-1){showToast('没有找到对应的用户消息');return;}let userMsg=session.messages[userIndex],userContent=userMsg.content;session.messages.splice(index,session.messages.length-index);session.summary='';saveSessionsToLocal();renderAll();showToast('🔄 正在重新生成...');setTimeout(()=>{sendMessage(userContent,!0);},200);}
async function expandMessage(index){let session=getCurrentSession();if(!session){showToast('请先创建对话');return;}if(index<0||index>=session.messages.length)return;let msg=session.messages[index];if(msg.role==='error'||msg.role==='loading'){showToast('无法扩写此消息');return;}let key=localStorage.getItem('deepseek_api_key');if(!key){showToast('请先保存 API Key');return;}let originalContent=msg.content;showToast('📝 正在扩写...');try{let expandPrompt='请将以下内容扩写，要求：\n1. 只扩写言语、动作、心理活动\n2. 不要增加环境描写、场景填充或无关细节\n3. 保持简洁，不要过度冗余\n4. 只输出扩写后的内容，不要加任何前缀或说明\n\n原文：\n'+originalContent,response=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'deepseek-v4-flash',messages:[{role:'system',content:'你是文本扩写助手。只扩写言语、动作、心理，不加环境描写，保持简洁。'},{role:'user',content:expandPrompt}],max_tokens:Math.min(parseInt(maxTokensSlider.value)||2048,512),temperature:0.7})}),data=await response.json();if(!response.ok){let errMsg=data.error?data.error.message:'请求失败';throw new Error('错误 '+response.status+': '+errMsg);}if(data.choices&&data.choices[0]){let expanded=data.choices[0].message.content.trim();showExpandedInInput(expanded);}else throw new Error('API 返回异常');}catch(error){let errorText='❌ 扩写失败: '+error.message;if(error.message.includes('401')||error.message.includes('403'))errorText='❌ API Key 无效，请重新输入';showToast(errorText);console.error(errorText);}}
async function manualSync(){if(!isCloudReady){showToast('云端未连接，尝试初始化...');await initCloud();if(!isCloudReady){showToast('❌ 云端连接失败');return;}}showToast('🔄 正在同步...');setSyncStatus('syncing');let cloudData=await loadFromCloud();if(cloudData!==null&&cloudData.length>0){sessions=cloudData;if(!currentSessionId||!sessions.some(s=>s.id===currentSessionId)){currentSessionId=sessions[0].id;}saveSessionsToLocal();renderAll();showToast('✅ 已拉取云端最新数据');setSyncStatus('manual');}else{let success=await syncToCloud(sessions);if(success){renderAll();showToast('✅ 同步完成！');}else{showToast('⚠️ 同步失败');}}}
async function saveSystemPrompt(){let s=getCurrentSession();if(!s){showToast('请先创建对话');return;}let prompt=systemPromptInput.value.trim();if(!prompt){showToast('请输入设定内容');return;}s.systemPrompt=prompt;s.updateTime=new Date().toISOString();saveSessionsToLocal();renderAll();showToast('✅ 设定已保存，正在同步...');await syncToCloud(sessions);showToast('✅ 设定已同步');}
function saveFixedContent(){let s=getCurrentSession();if(!s){showToast('请先创建对话');return;}let content=fixedContent.value.trim();s.fixedContent=content;s.updateTime=new Date().toISOString();saveSessionsToLocal();renderAll();showToast('✅ 固定模块已保存，正在同步...');syncToCloud(sessions).then(()=>{showToast('✅ 固定模块已同步');});}
function saveSummaryFromTextarea(){let s=getCurrentSession();if(!s){showToast('请先创建对话');return;}let newSummary=summaryTextarea.value.trim();s.summary=newSummary;s.updateTime=new Date().toISOString();saveSessionsToLocal();renderAll();showToast('✅ 动态摘要已保存，正在同步...');syncToCloud(sessions).then(()=>{showToast('✅ 动态摘要已同步');});isEditingSummary=!1;summaryCancelBtn.style.display='none';}
function cancelSummaryEdit(){let s=getCurrentSession();if(s)summaryTextarea.value=s.summary||'';isEditingSummary=!1;summaryCancelBtn.style.display='none';showToast('已取消编辑');}
modelSelect.addEventListener('change',function(){let model=this.value,config=MODEL_CONFIG[model];if(config){let savedKey=localStorage.getItem(config.keyStorage)||'';apiKeyInput.value=savedKey;if(savedKey){API_KEY=savedKey;enableChat(!0);}else{API_KEY='';enableChat(!1);apiKeyInput.focus();}showToast('已切换到: '+model);}});
saveKeyBtn.addEventListener('click',function(){let model=modelSelect.value,config=MODEL_CONFIG[model];if(!config){showToast('请选择有效模型');return;}let key=apiKeyInput.value.trim();if(!key){showToast('请输入 API Key');return;}if(!key.startsWith('sk-')&&!key.startsWith('sk')&&key.length<10){showToast('请输入有效的 API Key');return;}localStorage.setItem(config.keyStorage,key);API_KEY=key;enableChat(!0);let s=getCurrentSession();if(s){s.messages=s.messages.filter(m=>m.role!=='error');if(s.messages.length===0)s.messages.push({role:'assistant',content:'✅ API Key 已保存！请设定你的剧本。'});else s.messages.push({role:'assistant',content:'✅ API Key 已更新！'});s.updateTime=new Date().toISOString();saveSessionsToLocal();renderAll();}showToast('✅ 已保存 '+model+' 的 API Key');forceEnableInput();});
toggleBtn.addEventListener('click',function(){isCollapsed=!isCollapsed;if(isCollapsed){collapsibleSection.classList.add('collapsed');toggleBtn.textContent='⬇ 展开';document.body.classList.add('collapsed-mode');}else{collapsibleSection.classList.remove('collapsed');toggleBtn.textContent='⬆ 收起';document.body.classList.remove('collapsed-mode');}});
savePromptBtn.addEventListener('click',saveSystemPrompt);
fixedSaveBtn.addEventListener('click',saveFixedContent);
fullSummaryBtn.addEventListener('click',function(){let s=getCurrentSession();if(!s){showToast('请先创建对话');return;}if(countUserAssistantMessages(s.messages)<4){showToast('对话太短，至少 4 条消息后才能整理');return;}generateSummary('full',!0);});
incrementalSummaryBtn.addEventListener('click',function(){let s=getCurrentSession();if(!s){showToast('请先创建对话');return;}if(countUserAssistantMessages(s.messages)<4){showToast('对话太短，至少 4 条消息后才能更新');return;}if(!s.summary||s.summary.length===0){showToast('尚无动态摘要，请先使用「全量整理」');return;}generateSummary('incremental',!0);});
systemPromptInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();saveSystemPrompt();}});
summarySaveBtn.addEventListener('click',saveSummaryFromTextarea);
summaryCancelBtn.addEventListener('click',cancelSummaryEdit);
summaryTextarea.addEventListener('focus',function(){isEditingSummary=!0;summaryCancelBtn.style.display='inline-block';});
summaryTextarea.addEventListener('blur',function(){setTimeout(()=>{if(!isEditingSummary)summaryCancelBtn.style.display='none';},200);});
summaryTextarea.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();saveSummaryFromTextarea();}});
renameBtn.addEventListener('click',function(){let newName=renameInput.value.trim();if(!newName){showToast('请输入名称');return;}renameCurrentSession(newName);});
renameInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();renameBtn.click();}});
maxTokensSlider.addEventListener('input',function(){maxTokensDisplay.textContent=this.value;localStorage.setItem('deepseek_max_tokens',this.value);});
let savedMaxTokens=localStorage.getItem('deepseek_max_tokens');if(savedMaxTokens){maxTokensSlider.value=savedMaxTokens;maxTokensDisplay.textContent=savedMaxTokens;}
copyLastBtn.addEventListener('click',function(){let text=getLastReply();copyToClipboard(text||'没有找到回复');});
copyAllBtn.addEventListener('click',function(){let text=getAllText();copyToClipboard(text||'没有内容');});
exportBtn.addEventListener('click',function(){let text=getAllText();if(!text){showToast('没有内容可导出');return;}let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);let s=getCurrentSession();link.download=(s?s.name:'对话')+'.txt';link.click();URL.revokeObjectURL(link.href);showToast('✅ 导出成功');});
selectModeBtn.addEventListener('click',function(){selectMode=!selectMode;if(selectMode){selectedIndices.clear();selectModeBtn.textContent='❌ 退出';selectModeBtn.classList.add('active');selectInfo.style.display='flex';selectAllCheckbox.checked=!1;selectedCount.textContent='0条';}else{exitSelectMode();}renderChat();});
selectAllCheckbox.addEventListener('change',selectAllMessages);
copySelectedBtn.addEventListener('click',function(){let text=getSelectedText();copyToClipboard(text||'请先选择消息');});
sendBtn.addEventListener('click',function(){if(expandedText)clearExpandIndicator();sendMessage();});
userInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(expandedText)clearExpandIndicator();sendMessage();}});
userInput.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px';if(expandedText&&this.value!==expandedText)clearExpandIndicator();});
newSessionBtn.addEventListener('click',addNewSession);
manualSyncBtn.addEventListener('click',manualSync);
document.addEventListener('click',function(e){if(!e.target.closest('.message-wrapper')&&!e.target.closest('.msg-actions')){document.querySelectorAll('.message-wrapper.touch-show').forEach(el=>el.classList.remove('touch-show'));}});
modelSelect.addEventListener('change',function(){localStorage.setItem('selected_model',this.value);});

async function init(){await initCloud();loadSessionsFromLocal();if(isCloudReady){let cloudData=await loadFromCloud();if(cloudData!==null&&cloudData.length>0){sessions=cloudData;if(!currentSessionId||!sessions.some(s=>s.id===currentSessionId)){currentSessionId=sessions[0].id;}saveSessionsToLocal();renderAll();console.log('✅ 已从云端加载最新数据');}}if(sessions.length===0){let s=createSession('对话 1',DEFAULT_SYSTEM_PROMPT);sessions.push(s);currentSessionId=s.id;saveSessionsToLocal();}let savedModel=localStorage.getItem('selected_model')||'deepseek-v4-flash';if(MODEL_CONFIG[savedModel])modelSelect.value=savedModel;let config=MODEL_CONFIG[modelSelect.value];if(config){let savedKey=localStorage.getItem(config.keyStorage)||'';apiKeyInput.value=savedKey;if(savedKey){API_KEY=savedKey;enableChat(!0);}else{enableChat(!1);apiKeyInput.focus();}}renderAll();forceEnableInput();console.log('✅ 初始化完成（文游节拍器 · 三项优化全部整合）');console.log('📊 压缩阈值: '+COMPRESS_CONFIG.TRIGGER_COUNT+' 条消息');console.log('⏳ 摘要冷却: '+COMPRESS_COOLDOWN/60000+' 分钟');console.log('🎵 当前模型: '+modelSelect.value);}
init();
window.sendMessage=sendMessage;window.generateSummary=generateSummary;window.forceEnableInput=forceEnableInput;window.refreshMessage=refreshMessage;window.expandMessage=expandMessage;window.manualSync=manualSync;window.COMPRESS_CONFIG=COMPRESS_CONFIG;window.createSession=createSession;
</script>
</body>
