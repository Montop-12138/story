        <div class="modal-box">
            <button class="modal-close" id="listModalCloseBtn">✕</button>
            <h2>📚 剧本库</h2>
            <div id="scriptListContainer">
                <div class="script-list-empty">暂无剧本，点击「➕ 新建」创建</div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal-cancel" id="listModalCancelBtn">关闭</button>
                <button class="btn-modal-confirm" id="listModalNewBtn">➕ 新建剧本</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  🎭 默认 System Prompt
        // ============================================================
        const DEFAULT_SYSTEM_PROMPT = '你是一个沉浸式文字游戏的主持人。';

        // ============================================================
        //  数据模型
        // ============================================================
        // 剧本模板: { id, name, description, systemPrompt, initialScene, worldSetting, createTime }
        // 对话会话: { id, name, scriptId, messages, summary, createTime, updateTime }

        // ============================================================
        //  全局状态
        // ============================================================
        let API_KEY = localStorage.getItem('deepseek_api_key') || '';
        let scripts = [];
        let sessions = [];
        let currentScriptId = null;
        let currentSessionId = null;
        let isCollapsed = false;
        let selectMode = false;
        let selectedIndices = new Set();
        let isCloudReady = false;
        let isSyncing = false;
        let touchMessageIndex = null;
        let editingScriptId = null;

        const COLLECTION_NAME = 'conversations_v8';
        const SCRIPT_COLLECTION = 'scripts_v8';

        // ============================================================
        //  DOM 引用
        // ============================================================
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const chatBox = document.getElementById('chatBox');
        const chatScrollArea = document.getElementById('chatScrollArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusTip = document.getElementById('statusTip');
        const toast = document.getElementById('toast');
        const sessionBar = document.getElementById('sessionBar');
        const toggleBtn = document.getElementById('toggleCollapseBtn');
        const collapsibleSection = document.getElementById('collapsibleSection');
        const syncBadge = document.getElementById('syncBadge');
        const manualSyncBtn = document.getElementById('manualSyncBtn');
        const syncDot = document.getElementById('syncDot');
        const syncText = document.getElementById('syncText');

        const maxTokensSlider = document.getElementById('maxTokensSlider');
        const maxTokensDisplay = document.getElementById('maxTokensDisplay');
        const renameInput = document.getElementById('renameInput');
        const renameBtn = document.getElementById('renameBtn');

        const copyLastBtn = document.getElementById('copyLastBtn');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const exportBtn = document.getElementById('exportBtn');
        const selectModeBtn = document.getElementById('selectModeBtn');
        const selectInfo = document.getElementById('selectInfo');
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        const selectedCount = document.getElementById('selectedCount');
        const copySelectedBtn = document.getElementById('copySelectedBtn');
        const newSessionBtn = document.getElementById('newSessionBtn');

        const scriptSelect = document.getElementById('scriptSelect');
        const scriptsBtn = document.getElementById('scriptsBtn');
        const editScriptBtn = document.getElementById('editScriptBtn');
        const delScriptBtn = document.getElementById('delScriptBtn');
        const newScriptBtn = document.getElementById('newScriptBtn');
        const importScriptBtn = document.getElementById('importScriptBtn');
        const exportScriptBtn = document.getElementById('exportScriptBtn');

        const scriptModal = document.getElementById('scriptModal');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');
        const modalTitle = document.getElementById('modalTitle');
        const scriptNameInput = document.getElementById('scriptNameInput');
        const scriptDescInput = document.getElementById('scriptDescInput');
        const scriptPromptInput = document.getElementById('scriptPromptInput');
        const scriptSceneInput = document.getElementById('scriptSceneInput');
        const scriptWorldInput = document.getElementById('scriptWorldInput');

        const scriptListModal = document.getElementById('scriptListModal');
        const listModalCloseBtn = document.getElementById('listModalCloseBtn');
        const listModalCancelBtn = document.getElementById('listModalCancelBtn');
        const listModalNewBtn = document.getElementById('listModalNewBtn');
        const scriptListContainer = document.getElementById('scriptListContainer');

        // ============================================================
        //  Toast
        // ============================================================
        let toastTimer = null;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        //  工具函数
        // ============================================================
        function generateId() {
            return Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6);
        }

        function getSessionNameFromMessages(messages) {
            for (var i = 0; i < messages.length; i++) {
                if (messages[i].role === 'user') {
                    var txt = messages[i].content.replace(/\n/g, ' ').trim();
                    return txt.length > 15 ? txt.substring(0, 15) + '…' : txt;
                }
            }
            return '新对话';
        }

        function getCurrentScript() {
            for (var i = 0; i < scripts.length; i++) {
                if (scripts[i].id === currentScriptId) return scripts[i];
            }
            return null;
        }

        function getCurrentSession() {
            for (var i = 0; i < sessions.length; i++) {
                if (sessions[i].id === currentSessionId) return sessions[i];
            }
            return sessions[0];
        }

        function getSessionsForCurrentScript() {
            var result = [];
            for (var i = 0; i < sessions.length; i++) {
                if (sessions[i].scriptId === currentScriptId) {
                    result.push(sessions[i]);
                }
            }
            return result;
        }

        // ============================================================
        //  同步状态UI
        // ============================================================
        function setSyncStatus(status) {
            syncDot.className = 'sync-dot';
            if (status === 'synced') {
                syncDot.className = 'sync-dot';
                syncText.textContent = '已同步';
                syncBadge.textContent = '☁️ 云端';
                syncBadge.className = 'sync-badge';
            } else if (status === 'syncing') {
                syncDot.className = 'sync-dot syncing';
                syncText.textContent = '同步中...';
                syncBadge.textContent = '⏳ 同步中';
                syncBadge.className = 'sync-badge syncing';
            } else if (status === 'error') {
                syncDot.className = 'sync-dot error';
                syncText.textContent = '同步失败';
                syncBadge.textContent = '⚠️ 同步失败';
                syncBadge.className = 'sync-badge offline';
            } else if (status === 'offline') {
                syncDot.className = 'sync-dot error';
                syncText.textContent = '离线模式';
                syncBadge.textContent = '📡 离线';
                syncBadge.className = 'sync-badge offline';
            }
        }

        // ============================================================
        //  云端初始化
        // ============================================================
        const ENV_ID = 'deepseek-chat-d5gg0748z3b9dfe24';
        let cloudApp = null;
        let cloudDb = null;

        async function initCloud() {
            try {
                if (typeof cloudbase === 'undefined') {
                    console.error('❌ cloudbase SDK 未加载');
                    isCloudReady = false;
                    setSyncStatus('offline');
                    return false;
                }
                cloudApp = cloudbase.init({ env: ENV_ID });
                const auth = cloudApp.auth();
                const loginState = await auth.getLoginState();
                if (!loginState) {
                    await auth.anonymousAuthProvider().signIn();
                }
                cloudDb = cloudApp.database();
                isCloudReady = true;
                setSyncStatus('synced');
                console.log('✅ 云端初始化成功');
                return true;
            } catch (e) {
                console.error('❌ 云端初始化失败:', e);
                isCloudReady = false;
                setSyncStatus('offline');
                return false;
            }
        }

        // ============================================================
        //  云端数据操作
        // ============================================================
        async function loadScriptsFromCloud() {
            if (!isCloudReady || !cloudDb) return null;
            try {
                setSyncStatus('syncing');
                const res = await cloudDb.collection(SCRIPT_COLLECTION)
                    .orderBy('createTime', 'desc')
                    .limit(100)
                    .get();
                if (res.data && res.data.length > 0) {
                    return res.data.map(item => ({
                        id: item.id,
                        name: item.name || '未命名剧本',
                        description: item.description || '',
                        systemPrompt: item.systemPrompt || DEFAULT_SYSTEM_PROMPT,
                        initialScene: item.initialScene || '',
                        worldSetting: item.worldSetting || '',
                        createTime: item.createTime || new Date().toISOString(),
                        _cloudId: item._id
                    }));
                }
                return [];
            } catch (e) {
                console.error('❌ 拉取剧本失败:', e);
                setSyncStatus('error');
                return null;
            }
        }

        async function loadSessionsFromCloud() {
            if (!isCloudReady || !cloudDb) return null;
            try {
                setSyncStatus('syncing');
                const res = await cloudDb.collection(COLLECTION_NAME)
                    .orderBy('updateTime', 'desc')
                    .limit(200)
                    .get();
                if (res.data && res.data.length > 0) {
                    return res.data.map(item => ({
                        id: item.id,
                        name: item.name || '新对话',
                        scriptId: item.scriptId || 'default',
                        messages: item.messages || [],
                        summary: item.summary || '',
                        createTime: item.createTime || new Date().toISOString(),
                        updateTime: item.updateTime || new Date().toISOString(),
                        _cloudId: item._id
                    }));
                }
                return [];
            } catch (e) {
                console.error('❌ 拉取对话失败:', e);
                setSyncStatus('error');
                return null;
            }
        }

        async function syncScriptsToCloud(scriptsData) {
            if (!isCloudReady || !cloudDb) return false;
            if (isSyncing) return false;
            try {
                isSyncing = true;
                setSyncStatus('syncing');
                const collection = cloudDb.collection(SCRIPT_COLLECTION);
                const existing = await collection.limit(100).get();
                for (const item of existing.data) {
                    try { await collection.doc(item._id).remove(); } catch (e) {}
                }
                for (const script of scriptsData) {
                    await collection.add({
                        id: script.id,
                        name: script.name || '未命名剧本',
                        description: script.description || '',
                        systemPrompt: script.systemPrompt || DEFAULT_SYSTEM_PROMPT,
                        initialScene: script.initialScene || '',
                        worldSetting: script.worldSetting || '',
                        createTime: script.createTime || new Date().toISOString()
                    });
                }
                setSyncStatus('synced');
                isSyncing = false;
                return true;
            } catch (e) {
                console.error('❌ 同步剧本失败:', e);
                setSyncStatus('error');
                isSyncing = false;
                return false;
            }
        }

        async function syncSessionsToCloud(sessionsData) {
            if (!isCloudReady || !cloudDb) return false;
            if (isSyncing) return false;
            try {
                isSyncing = true;
                setSyncStatus('syncing');
                const collection = cloudDb.collection(COLLECTION_NAME);
                const existing = await collection.limit(200).get();
                for (const item of existing.data) {
                    try { await collection.doc(item._id).remove(); } catch (e) {}
                }
                for (const session of sessionsData) {
                    await collection.add({
                        id: session.id,
                        name: session.name || '新对话',
                        scriptId: session.scriptId || 'default',
                        messages: session.messages || [],
                        summary: session.summary || '',
                        createTime: session.createTime || new Date().toISOString(),
                        updateTime: session.updateTime || new Date().toISOString()
                    });
                }
                setSyncStatus('synced');
                isSyncing = false;
                return true;
            } catch (e) {
                console.error('❌ 同步对话失败:', e);
                setSyncStatus('error');
                isSyncing = false;
                return false;
            }
        }

        // ============================================================
        //  完整同步
        // ============================================================
        async function fullSync() {
            if (!isCloudReady) return;
            const cloudScripts = await loadScriptsFromCloud();
            const cloudSessions = await loadSessionsFromCloud();

            if (cloudScripts !== null && cloudScripts.length > 0) {
                scripts = cloudScripts;
            } else if (cloudScripts !== null && cloudScripts.length === 0) {
                await syncScriptsToCloud(scripts);
            } else {
                await syncScriptsToCloud(scripts);
            }

            if (cloudSessions !== null && cloudSessions.length > 0) {
                sessions = cloudSessions;
            } else if (cloudSessions !== null && cloudSessions.length === 0) {
                await syncSessionsToCloud(sessions);
            } else {
                await syncSessionsToCloud(sessions);
            }

            if (scripts.length === 0) {
                createDefaultScript();
            }

            if (!currentScriptId || !scripts.some(s => s.id === currentScriptId)) {
                currentScriptId = scripts[0].id;
            }

            const validSessions = getSessionsForCurrentScript();
            if (validSessions.length === 0) {
                const s = createSession('新对话', currentScriptId);
                sessions.push(s);
            }
            if (!currentSessionId || !sessions.some(s => s.id === currentSessionId && s.scriptId === currentScriptId)) {
                const valid = getSessionsForCurrentScript();
                currentSessionId = valid.length > 0 ? valid[0].id : sessions[0].id;
            }

            saveAllToLocal();
            renderAll();
        }

        // ============================================================
        //  默认剧本
        // ============================================================
        function createDefaultScript() {
            const defaultScript = {
                id: 'default_' + generateId(),
                name: '默认剧本',
                description: '通用文字游戏',
                systemPrompt: DEFAULT_SYSTEM_PROMPT,
                initialScene: '👋 你好！这是一个通用文字游戏。',
                worldSetting: '自由世界',
                createTime: new Date().toISOString()
            };
            scripts.push(defaultScript);
            currentScriptId = defaultScript.id;
            saveAllToLocal();
            return defaultScript;
        }

        // ============================================================
        //  本地存储
        // ============================================================
        function saveAllToLocal() {
            localStorage.setItem('deepseek_scripts_v8', JSON.stringify(scripts));
            localStorage.setItem('deepseek_sessions_v8', JSON.stringify(sessions));
            if (currentScriptId) {
                localStorage.setItem('deepseek_current_script_v8', currentScriptId);
            }
            if (currentSessionId) {
                localStorage.setItem('deepseek_current_session_v8', currentSessionId);
            }
        }

        function loadAllFromLocal() {
            const scriptsData = localStorage.getItem('deepseek_scripts_v8');
            if (scriptsData) {
                try { scripts = JSON.parse(scriptsData); } catch (e) { scripts = []; }
            } else {
                scripts = [];
            }

            const sessionsData = localStorage.getItem('deepseek_sessions_v8');
            if (sessionsData) {
                try { sessions = JSON.parse(sessionsData); } catch (e) { sessions = []; }
            } else {
                sessions = [];
            }

            const savedScript = localStorage.getItem('deepseek_current_script_v8');
            if (savedScript) {
                currentScriptId = savedScript;
            }

            const savedSession = localStorage.getItem('deepseek_current_session_v8');
            if (savedSession) {
                currentSessionId = savedSession;
            }
        }

        // ============================================================
        //  剧本操作
        // ============================================================
        function createScript(name, description, systemPrompt, initialScene, worldSetting) {
            return {
                id: generateId(),
                name: name || '未命名剧本',
                description: description || '',
                systemPrompt: systemPrompt || DEFAULT_SYSTEM_PROMPT,
                initialScene: initialScene || '',
                worldSetting: worldSetting || '',
                createTime: new Date().toISOString()
            };
        }

        function addScript(script) {
            scripts.push(script);
            saveAllToLocal();
            return script;
        }

        function updateScript(id, data) {
            for (var i = 0; i < scripts.length; i++) {
                if (scripts[i].id === id) {
                    scripts[i] = { ...scripts[i], ...data };
                    saveAllToLocal();
                    return scripts[i];
                }
            }
            return null;
        }

        function deleteScript(id) {
            if (scripts.length <= 1) {
                showToast('至少保留一个剧本');
                return false;
            }
            var hasSessions = false;
            for (var i = 0; i < sessions.length; i++) {
                if (sessions[i].scriptId === id) {
                    hasSessions = true;
                    break;
                }
            }
            if (hasSessions) {
                if (!confirm('该剧本下有对话记录，删除剧本将同时删除所有关联对话，确定继续吗？')) {
                    return false;
                }
                var newSessions = [];
                for (var j = 0; j < sessions.length; j++) {
                    if (sessions[j].scriptId !== id) {
                        newSessions.push(sessions[j]);
                    }
                }
                sessions = newSessions;
            }

            var newScripts = [];
            for (var k = 0; k < scripts.length; k++) {
                if (scripts[k].id !== id) newScripts.push(scripts[k]);
            }
            scripts = newScripts;

            if (currentScriptId === id) {
                currentScriptId = scripts[0].id;
                var validSessions = getSessionsForCurrentScript();
                if (validSessions.length === 0) {
                    var s = createSession('新对话', currentScriptId);
                    sessions.push(s);
                }
                currentSessionId = getSessionsForCurrentScript()[0].id;
            }

            saveAllToLocal();
            renderAll();
            showToast('已删除剧本');
            return true;
        }

        // ============================================================
        //  对话操作
        // ============================================================
        function createSession(name, scriptId) {
            return {
                id: generateId(),
                name: name || '新对话',
                scriptId: scriptId || currentScriptId || 'default',
                messages: [],
                summary: '',
                createTime: new Date().toISOString(),
                updateTime: new Date().toISOString()
            };
        }

        function addSession(session) {
            sessions.push(session);
            saveAllToLocal();
            return session;
        }

        function deleteSession(sessionId) {
            var sessionsForScript = getSessionsForCurrentScript();
            if (sessionsForScript.length <= 1) {
                showToast('当前剧本至少保留一个对话');
                return false;
            }
            var newSessions = [];
            for (var i = 0; i < sessions.length; i++) {
                if (sessions[i].id !== sessionId) newSessions.push(sessions[i]);
            }
            sessions = newSessions;
            if (currentSessionId === sessionId) {
                var valid = getSessionsForCurrentScript();
                currentSessionId = valid.length > 0 ? valid[0].id : sessions[0].id;
            }
            saveAllToLocal();
            renderAll();
            showToast('已删除对话');
            return true;
        }

        function switchScript(scriptId) {
            if (scriptId === currentScriptId) return;
            currentScriptId = scriptId;
            localStorage.setItem('deepseek_current_script_v8', currentScriptId);

            var validSessions = getSessionsForCurrentScript();
            if (validSessions.length === 0) {
                var s = createSession('新对话', currentScriptId);
                sessions.push(s);
                currentSessionId = s.id;
            } else {
                currentSessionId = validSessions[0].id;
            }
            localStorage.setItem('deepseek_current_session_v8', currentSessionId);
            saveAllToLocal();
            renderAll();
            showToast('已切换到: ' + getCurrentScript().name);
        }

        function switchSession(sessionId) {
            if (sessionId === currentSessionId) return;
            exitSelectMode();
            currentSessionId = sessionId;
            localStorage.setItem('deepseek_current_session_v8', currentSessionId);
            renderAll();
            var session = getCurrentSession();
            renameInput.value = session ? session.name || '' : '';
        }

        // ============================================================
        //  渲染
        // ============================================================
        function renderScriptSelect() {
            scriptSelect.innerHTML = '';
            for (var i = 0; i < scripts.length; i++) {
                var opt = document.createElement('option');
                opt.value = scripts[i].id;
                opt.textContent = scripts[i].name + (scripts[i].description ? ' — ' + scripts[i].description : '');
                if (scripts[i].id === currentScriptId) opt.selected = true;
                scriptSelect.appendChild(opt);
            }
            if (scripts.length === 0) {
                var opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '请创建剧本';
                scriptSelect.appendChild(opt);
            }
        }

        function renderSessionTabs() {
            sessionBar.innerHTML = '';
            var validSessions = getSessionsForCurrentScript();
            for (var i = 0; i < validSessions.length; i++) {
                var s = validSessions[i];
                var btn = document.createElement('button');
                btn.className = 'session-tab' + (s.id === currentSessionId ? ' active' : '');
                var nameSpan = document.createElement('span');
                nameSpan.textContent = s.name || '新对话';
                btn.appendChild(nameSpan);
                if (validSessions.length > 1) {
                    var del = document.createElement('button');
                    del.className = 'del-session';
                    del.textContent = '✕';
                    del.addEventListener('click', (function(id) {
                        return function(e) {
                            e.stopPropagation();
                            deleteSession(id);
                        };
                    })(s.id));
                    btn.appendChild(del);
                }
                btn.addEventListener('click', (function(id) {
                    return function() { switchSession(id); };
                })(s.id));
                sessionBar.appendChild(btn);
            }
            var addBtn = document.createElement('button');
            addBtn.className = 'btn-add-session';
            addBtn.textContent = '+';
            addBtn.addEventListener('click', function() {
                var s = createSession('新对话', currentScriptId);
                sessions.push(s);
                currentSessionId = s.id;
                saveAllToLocal();
                renderAll();
                showToast('✅ 已创建新对话');
                if (API_KEY) userInput.focus();
            });
            sessionBar.appendChild(addBtn);
        }

        function renderChat() {
            var session = getCurrentSession();
            chatBox.innerHTML = '';
            if (!session) {
                var div = document.createElement('div');
                div.className = 'message assistant';
                div.textContent = '👋 请先创建剧本和对话';
                chatBox.appendChild(div);
                return;
            }

            var script = getCurrentScript();
            if (script && session.messages.length === 0) {
                var infoDiv = document.createElement('div');
                infoDiv.className = 'message assistant';
                infoDiv.style.fontSize = '12px';
                infoDiv.style.opacity = '0.7';
                var scene = script.initialScene || '开始你的冒险吧！';
                infoDiv.innerHTML = '🎭 <b>' + script.name + '</b><br>' + scene;
                chatBox.appendChild(infoDiv);
            }

            if (session.messages.length === 0) {
                setTimeout(function() {
                    chatScrollArea.scrollTop = chatScrollArea.scrollHeight;
                }, 50);
                return;
            }

            for (var i = 0; i < session.messages.length; i++) {
                var msg = session.messages[i];
                var wrapper = document.createElement('div');
                wrapper.className = 'message-wrapper';
                if (msg.role === 'user') {
                    wrapper.classList.add('user-wrapper');
                }

                if (selectMode && msg.role !== 'error' && msg.role !== 'loading') {
                    wrapper.classList.add('select-mode');
                    var checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'msg-checkbox';
                    checkbox.checked = selectedIndices.has(i);
                    checkbox.addEventListener('change', (function(idx) {
                        return function() { toggleSelectMessage(idx); };
                    })(i));
                    wrapper.appendChild(checkbox);
                }

                var div = document.createElement('div');
                div.className = 'message ' + msg.role;
                if (msg.role === 'error' || msg.role === 'loading') {
                    div.textContent = msg.content;
                } else {
                    var contentSpan = document.createElement('span');
                    contentSpan.className = 'message-content';
                    contentSpan.innerHTML = msg.content.replace(/\n/g, '<br>');
                    div.appendChild(contentSpan);

                    if (msg.role === 'user') {
                        var textarea = document.createElement('textarea');
                        textarea.className = 'edit-textarea';
                        textarea.rows = 3;
                        textarea.value = msg.content;
                        div.appendChild(textarea);

                        var editActions = document.createElement('div');
                        editActions.className = 'edit-actions';
                        var saveBtn = document.createElement('button');
                        saveBtn.className = 'save-edit';
                        saveBtn.textContent = '✅ 保存';
                        saveBtn.addEventListener('click', (function(idx) {
                            return function(e) {
                                e.stopPropagation();
                                saveEditMessage(idx);
                            };
                        })(i));
                        var cancelBtn = document.createElement('button');
                        cancelBtn.className = 'cancel-edit';
                        cancelBtn.textContent = '取消';
                        cancelBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            cancelEditMessage();
                        });
                        editActions.appendChild(saveBtn);
                        editActions.appendChild(cancelBtn);
                        div.appendChild(editActions);
                    }

                    if (!selectMode && msg.role !== 'error' && msg.role !== 'loading') {
                        var actions = document.createElement('div');
                        actions.className = 'msg-actions';
                        if (msg.role === 'user') {
                            var editBtn = document.createElement('button');
                            editBtn.className = 'edit-msg-btn';
                            editBtn.textContent = '✏️ 编辑';
                            editBtn.addEventListener('click', (function(idx) {
                                return function(e) {
                                    e.stopPropagation();
                                    startEditMessage(idx);
                                };
                            })(i));
                            actions.appendChild(editBtn);
                        }
                        var delBtn = document.createElement('button');
                        delBtn.className = 'del-msg-btn';
                        delBtn.textContent = '🗑️ 删除';
                        delBtn.addEventListener('click', (function(idx) {
                            return function(e) {
                                e.stopPropagation();
                                deleteMessage(idx);
                            };
                        })(i));
                        actions.appendChild(delBtn);
                        div.appendChild(actions);

                        div.addEventListener('click', (function(idx) {
                            return function(e) {
                                if (e.target.closest('.edit-actions') || e.target.closest('.msg-actions')) return;
                                toggleTouchActions(idx);
                            };
                        })(i));
                    }
                }

                wrapper.appendChild(div);
                chatBox.appendChild(wrapper);
            }
            setTimeout(function() {
                chatScrollArea.scrollTop = chatScrollArea.scrollHeight;
            }, 50);
        }

        function renderAll() {
            renderScriptSelect();
            renderSessionTabs();
            renderChat();
            var session = getCurrentSession();
            renameInput.value = session ? session.name || '' : '';
            updateSelectedCount();
        }

        function enableChat(enabled) {
            userInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
            if (enabled) {
                userInput.focus();
                statusTip.innerHTML = '<span class="sync-status"><span class="sync-dot" id="syncDot"></span><span id="syncText">已同步</span></span> 💡 DeepSeek-V4-Flash · 多剧本版';
            } else {
                statusTip.innerHTML = '<span class="sync-status"><span class="sync-dot error" id="syncDot"></span><span id="syncText">未登录</span></span> ⏳ 请先输入 API Key';
            }
        }

        // ============================================================
        //  选择模式
        // ============================================================
        function exitSelectMode() {
            selectMode = false;
            selectedIndices.clear();
            selectModeBtn.textContent = '☑️ 选择';
            selectModeBtn.classList.remove('active');
            selectInfo.style.display = 'none';
        }

        function toggleSelectMessage(index) {
            if (!selectMode) return;
            var session = getCurrentSession();
            if (!session) return;
            var msg = session.messages[index];
            if (msg.role === 'error' || msg.role === 'loading') return;
            if (selectedIndices.has(index)) {
                selectedIndices.delete(index);
            } else {
                selectedIndices.add(index);
            }
            updateSelectedCount();
            renderChat();
        }

        function updateSelectedCount() {
            selectedCount.textContent = selectedIndices.size + '条';
            var session = getCurrentSession();
            if (session) {
                var total = 0;
                for (var i = 0; i < session.messages.length; i++) {
                    var m = session.messages[i];
                    if (m.role !== 'error' && m.role !== 'loading') total++;
                }
                selectAllCheckbox.checked = selectedIndices.size === total && total > 0;
            }
        }

        function selectAllMessages() {
            var session = getCurrentSession();
            if (!session) return;
            var allChecked = selectAllCheckbox.checked;
            selectedIndices.clear();
            if (allChecked) {
                for (var i = 0; i < session.messages.length; i++) {
                    var m = session.messages[i];
                    if (m.role !== 'error' && m.role !== 'loading') {
                        selectedIndices.add(i);
                    }
                }
            }
            updateSelectedCount();
            renderChat();
        }

        function getSelectedText() {
            var session = getCurrentSession();
            if (!session) return '';
            var sorted = Array.from(selectedIndices).sort(function(a, b) { return a - b; });
            var text = '📝 ' + session.name + '\n' + '='.repeat(40) + '\n\n';
            for (var i = 0; i < sorted.length; i++) {
                var idx = sorted[i];
                var msg = session.messages[idx];
                if (msg) {
                    var label = msg.role === 'user' ? '👤 用户' : '🤖 AI';
                    text += '【' + label + '】\n' + msg.content + '\n\n';
                }
            }
            return text;
        }

        // ============================================================
        //  消息操作
        // ============================================================
        function deleteMessage(index) {
            var session = getCurrentSession();
            if (!session) return;
            if (index < 0 || index >= session.messages.length) return;
            var msg = session.messages[index];
            if (msg.role === 'loading' || msg.role === 'error') return;

            var deleteCount = 1;
            if (msg.role === 'user') {
                var nextIndex = index + 1;
                while (nextIndex < session.messages.length) {
                    var nextMsg = session.messages[nextIndex];
                    if (nextMsg.role === 'user') break;
                    deleteCount++;
                    nextIndex++;
                }
            }

            if (!confirm('确定删除这条消息' + (deleteCount > 1 ? '及其后续回复' : '') + '吗？')) return;
            session.messages.splice(index, deleteCount);
            session.updateTime = new Date().toISOString();
            saveAllToLocal();
            renderAll();
            showToast('已删除');
        }

        function startEditMessage(index) {
            var session = getCurrentSession();
            if (!session) return;
            if (index < 0 || index >= session.messages.length) return;
            var msg = session.messages[index];
            if (msg.role === 'error' || msg.role === 'loading' || msg.role === 'assistant') {
                showToast('只能编辑用户消息');
                return;
            }

            var wrappers = chatBox.querySelectorAll('.message-wrapper');
            if (index < wrappers.length) {
                var wrapper = wrappers[index];
                var msgDiv = wrapper.querySelector('.message');
                if (msgDiv) {
                    document.querySelectorAll('.message.edit-mode').forEach(function(el) {
                        el.classList.remove('edit-mode');
                    });
                    msgDiv.classList.add('edit-mode');
                    var textarea = msgDiv.querySelector('.edit-textarea');
                    if (textarea) {
                        textarea.value = msg.content;
                        textarea.focus();
                        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
                    }
                }
            }
        }

        function saveEditMessage(index) {
            var session = getCurrentSession();
            if (!session) return;
            if (index < 0 || index >= session.messages.length) return;
            var msg = session.messages[index];

            var wrappers = chatBox.querySelectorAll('.message-wrapper');
            if (index < wrappers.length) {
                var wrapper = wrappers[index];
                var msgDiv = wrapper.querySelector('.message');
                if (msgDiv) {
                    var textarea = msgDiv.querySelector('.edit-textarea');
                    if (textarea) {
                        var newContent = textarea.value.trim();
                        if (!newContent) { showToast('内容不能为空'); return; }
                        msg.content = newContent;
                        msgDiv.classList.remove('edit-mode');

                        var nextIndex = index + 1;
                        if (nextIndex < session.messages.length) {
                            session.messages.splice(nextIndex);
                        }

                        session.updateTime = new Date().toISOString();
                        saveAllToLocal();
                        renderAll();
                        showToast('✅ 已修改，正在重新生成回复...');

                        setTimeout(function() {
                            sendMessage(newContent, true);
                        }, 200);
                    }
                }
            }
        }

        function cancelEditMessage() {
            document.querySelectorAll('.message.edit-mode').forEach(function(el) {
                el.classList.remove('edit-mode');
            });
        }

        function toggleTouchActions(index) {
            var wrappers = chatBox.querySelectorAll('.message-wrapper');
            for (var i = 0; i < wrappers.length; i++) {
                if (i !== index) {
                    wrappers[i].classList.remove('touch-show');
                }
            }
            if (index >= 0 && index < wrappers.length) {
                var wrapper = wrappers[index];
                var msg = getCurrentSession().messages[index];
                if (msg && msg.role !== 'loading' && msg.role !== 'error') {
                    wrapper.classList.toggle('touch-show');
                }
            }
        }

        // ============================================================
        //  复制/导出
        // ============================================================
        function getAllText() {
            var session = getCurrentSession();
            if (!session) return '';
            var script = getCurrentScript();
            var text = '📝 ' + session.name + '\n';
            if (script) text += '🎭 剧本: ' + script.name + '\n';
            text += '='.repeat(40) + '\n\n';
            for (var i = 0; i < session.messages.length; i++) {
                var msg = session.messages[i];
                if (msg.role === 'error' || msg.role === 'loading') continue;
                var label = msg.role === 'user' ? '👤 用户' : '🤖 AI';
                text += '【' + label + '】\n' + msg.content + '\n\n';
            }
            return text;
        }

        function getLastReply() {
            var session = getCurrentSession();
            if (!session) return '';
            for (var i = session.messages.length - 1; i >= 0; i--) {
                if (session.messages[i].role === 'assistant') {
                    return session.messages[i].content;
                }
            }
            return '';
        }

        function copyToClipboard(text) {
            if (!text) { showToast('没有内容可复制'); return; }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showToast('✅ 已复制到剪贴板');
                }).catch(function() {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✅ 已复制到剪贴板');
            } catch (e) {
                showToast('❌ 复制失败');
            }
            document.body.removeChild(textarea);
        }

        // ============================================================
        //  剧本模态框
        // ============================================================
        function openScriptModal(title, scriptData) {
            modalTitle.textContent = title;
            if (scriptData) {
                scriptNameInput.value = scriptData.name || '';
                scriptDescInput.value = scriptData.description || '';
                scriptPromptInput.value = scriptData.systemPrompt || '';
                scriptSceneInput.value = scriptData.initialScene || '';
                scriptWorldInput.value = scriptData.worldSetting || '';
                editingScriptId = scriptData.id;
            } else {
                scriptNameInput.value = '';
                scriptDescInput.value = '';
                scriptPromptInput.value = DEFAULT_SYSTEM_PROMPT;
                scriptSceneInput.value = '';
                scriptWorldInput.value = '';
                editingScriptId = null;
            }
            scriptModal.classList.add('show');
        }

        function closeScriptModal() {
            scriptModal.classList.remove('show');
            editingScriptId = null;
        }

        function saveScriptFromModal() {
            var name = scriptNameInput.value.trim();
            if (!name) { showToast('请输入剧本名称'); return; }
            var desc = scriptDescInput.value.trim();
            var prompt = scriptPromptInput.value.trim() || DEFAULT_SYSTEM_PROMPT;
            var scene = scriptSceneInput.value.trim();
            var world = scriptWorldInput.value.trim();

            if (editingScriptId) {
                var updated = updateScript(editingScriptId, {
                    name: name,
                    description: desc,
                    systemPrompt: prompt,
                    initialScene: scene,
                    worldSetting: world
                });
                if (updated) {
                    closeScriptModal();
                    saveAllToLocal();
                    renderAll();
                    showToast('✅ 剧本已更新: ' + name);
                }
            } else {
                var newScript = createScript(name, desc, prompt, scene, world);
                addScript(newScript);
                currentScriptId = newScript.id;
                var s = createSession('新对话', currentScriptId);
                sessions.push(s);
                currentSessionId = s.id;
                closeScriptModal();
                saveAllToLocal();
                renderAll();
                showToast('✅ 剧本已创建: ' + name);
            }
        }

        // ============================================================
        //  剧本列表模态框
        // ============================================================
        function renderScriptList() {
            scriptListContainer.innerHTML = '';
            if (scripts.length === 0) {
                scriptListContainer.innerHTML = '<div class="script-list-empty">📭 暂无剧本，点击「新建剧本」创建</div>';
                return;
            }
            for (var i = 0; i < scripts.length; i++) {
                var s = scripts[i];
                var item = document.createElement('div');
                item.className = 'script-list-item';
                var info = document.createElement('div');
                info.className = 'script-info';
                var nameSpan = document.createElement('div');
                nameSpan.className = 'name';
                nameSpan.textContent = s.name + (s.id === currentScriptId ? ' ✅' : '');
                var descSpan = document.createElement('div');
                descSpan.className = 'desc';
                descSpan.textContent = s.description || '无描述';
                var previewSpan = document.createElement('div');
                previewSpan.className = 'preview';
                var previewText = s.systemPrompt ? s.systemPrompt.substring(0, 60) : '';
                previewSpan.textContent = previewText ? '📝 ' + previewText + '…' : '';
                info.appendChild(nameSpan);
                info.appendChild(descSpan);
                if (previewText) info.appendChild(previewSpan);
                item.appendChild(info);

                var actions = document.createElement('div');
                actions.className = 'script-actions';

                var useBtn = document.createElement('button');
                useBtn.className = 'btn-use';
                useBtn.textContent = '使用';
                useBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    switchScript(s.id);
                    scriptListModal.classList.remove('show');
                });
                actions.appendChild(useBtn);

                var editBtn = document.createElement('button');
                editBtn.className = 'btn-edit-s';
                editBtn.textContent = '✏️';
                editBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    scriptListModal.classList.remove('show');
                    openScriptModal('✏️ 编辑剧本', s);
                });
                actions.appendChild(editBtn);

                if (scripts.length > 1) {
                    var delBtn = document.createElement('button');
                    delBtn.className = 'btn-del-s';
                    delBtn.textContent = '🗑️';
                    delBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (confirm('确定删除剧本 "' + s.name + '" 吗？')) {
                            deleteScript(s.id);
                            renderScriptList();
                        }
                    });
                    actions.appendChild(delBtn);
                }

                item.appendChild(actions);
                scriptListContainer.appendChild(item);
            }
        }

        function openScriptListModal() {
            renderScriptList();
            scriptListModal.classList.add('show');
        }

        function closeScriptListModal() {
            scriptListModal.classList.remove('show');
        }

        // ============================================================
        //  剧本导入/导出
        // ============================================================
        function exportScriptData() {
            var script = getCurrentScript();
            if (!script) { showToast('没有当前剧本'); return; }
            var data = {
                version: '1.0',
                type: 'script',
                script: {
                    name: script.name,
                    description: script.description,
                    systemPrompt: script.systemPrompt,
                    initialScene: script.initialScene,
                    worldSetting: script.worldSetting
                }
            };
            var json = JSON.stringify(data, null, 2);
            var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '剧本_' + script.name + '.json';
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('✅ 剧本已导出');
        }

        function importScriptFromFile() {
            var input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                var file = e.target.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        var data = JSON.parse(ev.target.result);
                        if (data.type === 'script' && data.script) {
                            var s = data.script;
                            var newScript = createScript(
                                s.name || '导入的剧本',
                                s.description || '',
                                s.systemPrompt || DEFAULT_SYSTEM_PROMPT,
                                s.initialScene || '',
                                s.worldSetting || ''
                            );
                            addScript(newScript);
                            renderAll();
                            showToast('✅ 剧本导入成功: ' + newScript.name);
                        } else {
                            showToast('❌ 无效的剧本文件');
                        }
                    } catch (err) {
                        showToast('❌ 解析失败: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // ============================================================
        //  📤 发送消息
        // ============================================================
        async function sendMessage(msg, isEdit) {
            if (typeof msg !== 'string') {
                msg = userInput.value.trim();
            }
            if (!msg) { showToast('请输入消息'); return; }

            var key = localStorage.getItem('deepseek_api_key');
            if (!key) { showToast('请先保存 API Key'); return; }

            var script = getCurrentScript();
            if (!script) { showToast('请先创建剧本'); return; }

            if (!isEdit) {
                var session = getCurrentSession();
                session.messages.push({ role: 'user', content: msg, timestamp: new Date().toISOString() });
                session.updateTime = new Date().toISOString();
                userInput.value = '';
                saveAllToLocal();
                renderAll();
            }

            var session = getCurrentSession();
            var newMsgs = [];
            for (var i = 0; i < session.messages.length; i++) {
                if (session.messages[i].role !== 'loading') newMsgs.push(session.messages[i]);
            }
            session.messages = newMsgs;

            session.messages.push({ role: 'loading', content: '🤔 思考中...' });
            session.updateTime = new Date().toISOString();
            saveAllToLocal();
            renderAll();
            sendBtn.disabled = true;

            try {
                var maxTokens = parseInt(maxTokensSlider.value) || 2048;
                var history = [];
                for (var i = 0; i < session.messages.length; i++) {
                    var m = session.messages[i];
                    if (m.role === 'user' || m.role === 'assistant') {
                        history.push({ role: m.role, content: m.content });
                    }
                }

                var systemPrompt = script.systemPrompt || DEFAULT_SYSTEM_PROMPT;

                var response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + key
                    },
                    body: JSON.stringify({
                        model: 'deepseek-v4-flash',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            ...history
                        ],
                        max_tokens: maxTokens,
                        temperature: 0.8
                    })
                });

                var data = await response.json();

                var newMsgs2 = [];
                for (var j = 0; j < session.messages.length; j++) {
                    if (session.messages[j].role !== 'loading') newMsgs2.push(session.messages[j]);
                }
                session.messages = newMsgs2;

                if (!response.ok) {
                    var errMsg = data.error ? data.error.message : '请求失败';
                    throw new Error('错误 ' + response.status + ': ' + errMsg);
                }

                if (data.choices && data.choices[0]) {
                    var reply = data.choices[0].message.content;
                    session.messages.push({ role: 'assistant', content: reply, timestamp: new Date().toISOString() });
                    if (session.name === '新对话' && session.messages.length > 0) {
                        session.name = getSessionNameFromMessages(session.messages);
                    }
                    session.updateTime = new Date().toISOString();
                    saveAllToLocal();
                    renderAll();
                } else {
                    throw new Error('API 返回异常');
                }

            } catch (error) {
                var newMsgs3 = [];
                for (var k = 0; k < session.messages.length; k++) {
                    if (session.messages[k].role !== 'loading') newMsgs3.push(session.messages[k]);
                }
                session.messages = newMsgs3;

                var errorText = '❌ ' + error.message;
                if (error.message.includes('401') || error.message.includes('403')) {
                    errorText = '❌ API Key 无效，请重新输入';
                    localStorage.removeItem('deepseek_api_key');
                    API_KEY = '';
                    enableChat(false);
                    apiKeyInput.value = '';
                } else if (error.message.includes('Failed to fetch')) {
                    errorText = '❌ 网络连接失败';
                }
                session.messages.push({ role: 'error', content: errorText });
                session.updateTime = new Date().toISOString();
                saveAllToLocal();
                renderAll();
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
                forceEnableInput();
            }
        }

        // ============================================================
        //  强制启用输入
        // ============================================================
        function forceEnableInput() {
            if (userInput) {
                userInput.disabled = false;
                userInput.style.opacity = '1';
                userInput.style.pointerEvents = 'auto';
            }
            if (sendBtn) {
                sendBtn.disabled = false;
            }
            if (userInput) {
                userInput.focus();
            }
        }

        // ============================================================
        //  事件绑定
        // ============================================================
        saveKeyBtn.addEventListener('click', function() {
            var key = apiKeyInput.value.trim();
            if (!key) { showToast('请输入 API Key'); return; }
            if (!key.startsWith('sk-')) { showToast('格式错误，应以 sk- 开头'); return; }
            API_KEY = key;
            localStorage.setItem('deepseek_api_key', key);
            enableChat(true);
            var session = getCurrentSession();
            if (session) {
                var newMsgs = [];
                for (var i = 0; i < session.messages.length; i++) {
                    if (session.messages[i].role !== 'error') newMsgs.push(session.messages[i]);
                }
                session.messages = newMsgs;
                if (session.messages.length === 0) {
                    session.messages.push({ role: 'assistant', content: '✅ API Key 已保存！' });
                } else {
                    session.messages.push({ role: 'assistant', content: '✅ API Key 已更新！' });
                }
                session.updateTime = new Date().toISOString();
                saveAllToLocal();
                renderAll();
            }
            showToast('✅ API Key 已保存');
            forceEnableInput();
        });

        toggleBtn.addEventListener('click', function() {
            isCollapsed = !isCollapsed;
            if (isCollapsed) {
                collapsibleSection.classList.add('collapsed');
                toggleBtn.textContent = '⬇ 展开';
                document.body.classList.add('collapsed-mode');
            } else {
                collapsibleSection.classList.remove('collapsed');
                toggleBtn.textContent = '⬆ 收起';
                document.body.classList.remove('collapsed-mode');
            }
        });

        scriptSelect.addEventListener('change', function() {
            var val = this.value;
            if (val) switchScript(val);
        });

        scriptsBtn.addEventListener('click', openScriptListModal);
        newScriptBtn.addEventListener('click', function() {
            openScriptModal('📜 创建新剧本', null);
        });
        editScriptBtn.addEventListener('click', function() {
            var script = getCurrentScript();
            if (script) {
                openScriptModal('✏️ 编辑剧本', script);
            } else {
                showToast('请先选择一个剧本');
            }
        });
        delScriptBtn.addEventListener('click', function() {
            var script = getCurrentScript();
            if (script) {
                deleteScript(script.id);
            } else {
                showToast('请先选择一个剧本');
            }
        });
        exportScriptBtn.addEventListener('click', exportScriptData);
        importScriptBtn.addEventListener('click', importScriptFromFile);

        modalCloseBtn.addEventListener('click', closeScriptModal);
        modalCancelBtn.addEventListener('click', closeScriptModal);
        modalConfirmBtn.addEventListener('click', saveScriptFromModal);

        listModalCloseBtn.addEventListener('click', closeScriptListModal);
        listModalCancelBtn.addEventListener('click', closeScriptListModal);
        listModalNewBtn.addEventListener('click', function() {
            closeScriptListModal();
            openScriptModal('📜 创建新剧本', null);
        });

        scriptModal.addEventListener('click', function(e) {
            if (e.target === this) closeScriptModal();
        });
        scriptListModal.addEventListener('click', function(e) {
            if (e.target === this) closeScriptListModal();
        });

        renameBtn.addEventListener('click', function() {
            var newName = renameInput.value.trim();
            if (!newName) { showToast('请输入名称'); return; }
            var session = getCurrentSession();
            if (session) {
                session.name = newName;
                session.updateTime = new Date().toISOString();
                saveAllToLocal();
                renderAll();
                showToast('✅ 已重命名为: ' + newName);
            }
        });
        renameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault();
                renameBtn.click(); }
        });

        maxTokensSlider.addEventListener('input', function() {
            maxTokensDisplay.textContent = this.value;
            localStorage.setItem('deepseek_max_tokens', this.value);
        });
        var savedMaxTokens = localStorage.getItem('deepseek_max_tokens');
        if (savedMaxTokens) {
            maxTokensSlider.value = savedMaxTokens;
            maxTokensDisplay.textContent = savedMaxTokens;
        }

        copyLastBtn.addEventListener('click', function() {
            var text = getLastReply();
            copyToClipboard(text || '没有找到回复');
        });
        copyAllBtn.addEventListener('click', function() {
            var text = getAllText();
            copyToClipboard(text || '没有内容');
        });
        exportBtn.addEventListener('click', function() {
            var text = getAllText();
            if (!text) { showToast('没有内容可导出'); return; }
            var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            var session = getCurrentSession();
            link.download = (session ? session.name : '对话') + '.txt';
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('✅ 导出成功');
        });

        selectModeBtn.addEventListener('click', function() {
            selectMode = !selectMode;
            if (selectMode) {
                selectedIndices.clear();
                selectModeBtn.textContent = '❌ 退出';
                selectModeBtn.classList.add('active');
                selectInfo.style.display = 'flex';
                selectAllCheckbox.checked = false;
                selectedCount.textContent = '0条';
            } else {
                exitSelectMode();
            }
            renderChat();
        });
        selectAllCheckbox.addEventListener('change', selectAllMessages);
        copySelectedBtn.addEventListener('click', function() {
            var text = getSelectedText();
            copyToClipboard(text || '请先选择消息');
        });

        sendBtn.addEventListener('click', function() { sendMessage(); });
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 80) + 'px';
        });

        newSessionBtn.addEventListener('click', function() {
            var s = createSession('新对话', currentScriptId);
            sessions.push(s);
            currentSessionId = s.id;
            saveAllToLocal();
            renderAll();
            showToast('✅ 已创建新对话');
            if (API_KEY) userInput.focus();
        });

        manualSyncBtn.addEventListener('click', async function() {
            if (!isCloudReady) {
                showToast('云端未连接，尝试初始化...');
                await initCloud();
                if (!isCloudReady) {
                    showToast('❌ 云端连接失败');
                    return;
                }
            }
            showToast('🔄 正在同步...');
            await fullSync();
            showToast('✅ 同步完成');
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.message-wrapper') && !e.target.closest('.msg-actions')) {
                document.querySelectorAll('.message-wrapper.touch-show').forEach(function(el) {
                    el.classList.remove('touch-show');
                });
            }
        });

        // ============================================================
        //  🚀 初始化
        // ============================================================
        async function init() {
            await initCloud();

            loadAllFromLocal();

            if (scripts.length === 0) {
                createDefaultScript();
            }

            如果 (!currentScriptId || !scripts.some(s => s.id === currentScriptId)) {
                currentScriptId = scripts[0].id;
            }

            var validSessions = getSessionsForCurrentScript();
            如果 (validSessions.长度 === 0) {
                var s = createSession('新对话', currentScriptId);
                sessions.push(s);
            }
            如果 (!currentSessionId || !sessions.some(s => s.id === currentSessionId && s.scriptId === currentScriptId)) {
                var valid = getSessionsForCurrentScript();
                currentSessionId = valid.length > 0 ? valid[0].id : sessions[0].id;
            }

            saveAllToLocal();

            如果 (API_KEY) {
                apiKeyInput.value = API_KEY;
                enableChat(true);
            } else {
                enableChat(false);
                apiKeyInput.focus();
            }

            renderAll();

            if (isCloudReady) {
                await fullSync();
            }

            forceEnableInput();
            console.log('✅ 初始化完成（index8 - 多剧本版）');
        }

        初始化();

        window.sendMessage = sendMessage;
        window.SYSTEM_PROMPT = DEFAULT_SYSTEM_PROMPT;
        window.forceEnableInput = forceEnableInput;
        window.fullSync = fullSync;
    </script>
</主体>
</html>
