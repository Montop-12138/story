<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek 智能助手 · 多剧本版</title>
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js">
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(145deg, #f0f7ff 0%, #e6f0fa 50%, #dce8f5 100%);
            overflow: hidden;
        }

        /* ===== 主容器 ===== */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            position: relative;
        }

        /* ===== 顶部固定区域 ===== */
        .header-fixed {
            flex-shrink: 0;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px 20px 0 0;
            padding: 6px 10px 4px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ===== 标题栏 ===== */
        h1 {
            font-size: 16px;
            color: #ffffff;
            text-align: center;
            padding: 6px 12px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 40px;
            background: linear-gradient(135deg, #4facfe 0%, #00d4ff 45%, #56d4dd 80%, #a8d8ea 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.2);
        }
        h1::before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 10%;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 60px -30px 0 10px rgba(255, 255, 255, 0.1), 120px -10px 0 5px rgba(255, 255, 255, 0.15), 200px -40px 0 20px rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 20%;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: -80px -20px 0 15px rgba(255, 255, 255, 0.08), -150px -50px 0 8px rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }
        h1 .title-left {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            z-index: 1;
        }
        h1 .title-left .app-name {
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            font-size: 15px;
        }
        h1 .title-left .version-tag {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.2);
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 500;
        }
        .sync-badge {
            font-size: 8px;
            color: #fff;
            background: rgba(16, 185, 129, 0.8);
            padding: 1px 6px;
            border-radius: 8px;
            font-weight: 600;
            margin-left: 2px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .sync-badge:hover {
            transform: scale(1.05);
        }
        .sync-badge.offline {
            background: rgba(239, 68, 68, 0.8);
        }
        .sync-badge.syncing {
            background: rgba(251, 191, 36, 0.8);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .ds-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
        }
        .ds-icon span {
            font-size: 14px;
            font-weight: 800;
            background: linear-gradient(135deg, #4facfe 0%, #00d4ff 60%, #36d1dc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .header-actions button {
            padding: 3px 10px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .header-actions button:active {
            transform: scale(0.95);
        }
        .btn-new {
            background: rgba(255, 255, 255, 0.15);
        }
        .toggle-collapse-btn {
            background: rgba(255, 255, 255, 0.1);
            font-size: 10px;
            padding: 3px 8px;
        }
        .btn-sync-manual {
            background: rgba(255, 255, 255, 0.15);
            font-size: 13px;
            padding: 3px 8px;
        }
        .btn-scripts {
            background: rgba(255, 255, 255, 0.25);
            font-size: 10px;
            padding: 3px 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* ===== 折叠区域 ===== */
        .collapsible-section {
            transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.3s ease, padding 0.3s ease;
            max-height: 380px;
            opacity: 1;
            overflow: hidden;
            margin-bottom: 2px;
            padding: 0;
        }
        .collapsible-section.collapsed {
            max-height: 0 !important;
            opacity: 0;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden;
        }
        .collapsible-section.collapsed * {
            max-height: 0 !important;
            opacity: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            border: none !important;
        }
        .collapsible-section.collapsed .api-section {
            display: none !important;
        }
        .collapsible-section.collapsed .control-bar {
            display: none !important;
        }
        .collapsible-section.collapsed .share-bar {
            display: none !important;
        }
        .collapsible-section.collapsed .script-bar {
            display: none !important;
        }

        .collapsed-mode h1 {
            padding: 4px 10px;
            min-height: 34px;
            font-size: 14px;
        }

        /* ===== 控制栏 ===== */
        .api-section {
            display: flex;
            gap: 4px;
            padding: 4px 0;
            flex-shrink: 0;
        }
        .api-section input {
            flex: 1;
            padding: 5px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            font-size: 11px;
            outline: none;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            transition: all 0.3s;
            min-height: 30px;
        }
        .api-section input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.15);
            background: rgba(255, 255, 255, 0.8);
        }
        .api-section input::placeholder {
            color: rgba(0, 0, 0, 0.3);
            font-size: 11px;
        }
        .api-section button {
            padding: 5px 14px;
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
            transition: all 0.3s;
            white-space: nowrap;
            min-height: 30px;
        }
        .api-section button:active {
            transform: scale(0.97);
        }

        .control-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 8px;
            padding: 3px 0 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            font-size: 11px;
            color: #1a1a2e;
        }
        .control-bar .slider-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1 1 120px;
        }
        .control-bar .slider-group label {
            white-space: nowrap;
            font-weight: 500;
            font-size: 11px;
            color: rgba(0, 0, 0, 0.6);
        }
        .control-bar .slider-group input[type="range"] {
            flex: 1;
            min-width: 40px;
            accent-color: #4facfe;
            height: 3px;
            cursor: pointer;
        }
        .control-bar .slider-value {
            min-width: 26px;
            text-align: center;
            font-weight: 700;
            color: #4facfe;
            font-size: 11px;
        }
        .control-bar .rename-group {
            display: flex;
            align-items: center;
            gap: 3px;
            flex: 1 1 100px;
        }
        .control-bar .rename-group input {
            flex: 1;
            padding: 3px 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 11px;
            outline: none;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            min-height: 26px;
        }
        .control-bar .rename-group input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
            background: rgba(255, 255, 255, 0.7);
        }
        .control-bar .rename-group button {
            padding: 3px 10px;
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            min-height: 26px;
            white-space: nowrap;
        }
        .control-bar .rename-group button:active {
            transform: scale(0.95);
        }

        .share-bar {
            display: flex;
            gap: 3px;
            padding: 3px 0 4px;
            flex-shrink: 0;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .share-bar button {
            padding: 3px 8px;
            border: none;
            border-radius: 8px;
            font-size: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            white-space: nowrap;
            min-height: 24px;
        }
        .share-bar button:active {
            transform: scale(0.95);
        }
        .share-bar .btn-copy {
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border: none;
        }
        .share-bar .btn-copy-all {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border: none;
        }
        .share-bar .btn-export {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            border: none;
        }
        .share-bar .btn-select-mode {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            border: none;
        }
        .share-bar .btn-select-mode.active {
            background: linear-gradient(135deg, #f5576c, #ff6b6b);
        }
        .share-bar .select-info {
            font-size: 10px;
            color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 3px;
            background: rgba(255, 255, 255, 0.4);
            padding: 2px 8px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        .share-bar .select-info input[type="checkbox"] {
            accent-color: #4facfe;
            width: 12px;
            height: 12px;
            cursor: pointer;
        }
        .share-bar .select-info .copy-selected-btn {
            padding: 2px 8px;
            font-size: 9px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        /* ===== 剧本栏（新增） ===== */
        .script-bar {
            display: flex;
            gap: 4px;
            padding: 3px 0 4px;
            flex-shrink: 0;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            align-items: center;
        }
        .script-bar .script-label {
            font-size: 10px;
            font-weight: 600;
            color: rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }
        .script-bar .script-select {
            flex: 1;
            min-width: 80px;
            padding: 3px 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            outline: none;
            cursor: pointer;
            min-height: 26px;
        }
        .script-bar .script-select:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }
        .script-bar .script-select option {
            padding: 4px 8px;
        }
        .script-bar .script-btn {
            padding: 3px 10px;
            border: none;
            border-radius: 8px;
            font-size: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
            min-height: 26px;
        }
        .script-bar .btn-edit-script {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }
        .script-bar .btn-del-script {
            background: rgba(239, 68, 68, 0.7);
            color: white;
        }
        .script-bar .btn-new-script {
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
        }
        .script-bar .btn-import-script {
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: white;
        }
        .script-bar .btn-export-script {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
        }

        /* ===== 会话标签栏 ===== */
        .session-bar {
            display: flex;
            gap: 3px;
            padding: 4px 0 6px;
            flex-shrink: 0;
            overflow-x: auto;
            flex-wrap: nowrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2px;
        }
        .session-bar::-webkit-scrollbar {
            height: 2px;
        }
        .session-bar::-webkit-scrollbar-thumb {
            background: rgba(79, 172, 254, 0.3);
            border-radius: 10px;
        }
        .session-tab {
            padding: 3px 12px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            color: rgba(0, 0, 0, 0.6);
            transition: all 0.25s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .session-tab.active {
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
        }
        .session-tab .del-session {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 10px;
            opacity: 0.5;
            padding: 0 2px;
        }
        .session-tab .del-session:hover {
            opacity: 1;
        }
        .btn-add-session {
            padding: 3px 10px;
            background: rgba(79, 172, 254, 0.1);
            color: #4facfe;
            border: 1px dashed rgba(79, 172, 254, 0.3);
            border-radius: 16px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .btn-add-session:hover {
            background: rgba(79, 172, 254, 0.2);
        }
        .btn-add-session:active {
            transform: scale(0.95);
        }

        /* ===== 聊天区域 ===== */
        .chat-scroll-area {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding: 8px 4px 4px 4px;
            margin: 2px 0;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            -webkit-overflow-scrolling: touch;
        }
        .chat-scroll-area::-webkit-scrollbar {
            width: 3px;
        }
        .chat-scroll-area::-webkit-scrollbar-thumb {
            background: rgba(79, 172, 254, 0.3);
            border-radius: 10px;
        }

        .chat-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 100%;
        }

        /* ===== 消息样式 ===== */
        .message-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 100%;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }
        .message-wrapper.user-wrapper {
            align-items: flex-end;
        }

        .message-wrapper .msg-actions {
            display: none;
            gap: 3px;
            margin-top: 2px;
            font-size: 10px;
            flex-wrap: wrap;
        }
        .message-wrapper:hover .msg-actions {
            display: flex;
        }
        .message-wrapper.touch-show .msg-actions {
            display: flex;
        }

        .message-wrapper .msg-actions button {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 5px;
            padding: 1px 8px;
            font-size: 10px;
            cursor: pointer;
            color: #555;
            transition: all 0.2s;
            font-weight: 500;
        }
        .message-wrapper .msg-actions button:hover {
            background: white;
            transform: scale(1.05);
        }
        .message-wrapper .msg-actions .del-msg-btn {
            color: #dc2626;
        }
        .message-wrapper .msg-actions .del-msg-btn:hover {
            background: #fee2e2;
        }
        .message-wrapper .msg-actions .edit-msg-btn {
            color: #4facfe;
        }
        .message-wrapper .msg-actions .edit-msg-btn:hover {
            background: #dbe4fe;
        }

        .message-wrapper.select-mode .msg-actions {
            display: none !important;
        }

        .message-wrapper .msg-checkbox {
            display: none;
            margin-right: 4px;
            align-self: center;
            accent-color: #4facfe;
            width: 14px;
            height: 14px;
        }
        .message-wrapper.select-mode .msg-checkbox {
            display: inline-block;
        }
        .message-wrapper.select-mode {
            flex-direction: row;
            align-items: center;
            gap: 3px;
        }
        .message-wrapper.select-mode .message {
            flex: 1;
        }

        .message {
            max-width: 85%;
            padding: 8px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.55) 0%, rgba(0, 210, 255, 0.4) 60%, rgba(79, 210, 240, 0.2) 100%);
            color: #1a3a5c;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 16px rgba(79, 172, 254, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .message.assistant {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            color: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .message.error {
            align-self: center;
            background: rgba(254, 226, 226, 0.7);
            color: #dc2626;
            font-size: 12px;
            max-width: 90%;
            text-align: center;
            border-radius: 12px;
            padding: 6px 14px;
        }
        .message.loading {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.6);
            color: #999;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom-left-radius: 4px;
        }

        .message.edit-mode .message-content {
            display: none;
        }
        .message.edit-mode .edit-textarea {
            display: block;
        }
        .message .edit-textarea {
            display: none;
            width: 100%;
            min-width: 180px;
            padding: 6px 10px;
            border: 2px solid #4facfe;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            background: rgba(255, 255, 255, 0.95);
            outline: none;
            box-shadow: 0 0 0 4px rgba(79, 172, 254, 0.1);
        }
        .message .edit-textarea:focus {
            border-color: #4facfe;
        }
        .message .edit-actions {
            display: none;
            gap: 4px;
            margin-top: 4px;
        }
        .message.edit-mode .edit-actions {
            display: flex;
        }
        .message .edit-actions button {
            padding: 2px 12px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .message .edit-actions .save-edit {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }
        .message .edit-actions .save-edit:hover {
            transform: scale(1.03);
        }
        .message .edit-actions .cancel-edit {
            background: rgba(0, 0, 0, 0.08);
            color: #555;
        }
        .message .edit-actions button:active {
            transform: scale(0.95);
        }

        @keyframes fadeIn {
            from {

</head>
<body>

    <div class="app-container">

        <!-- ===== 顶部固定区域 ===== -->
        <div class="header-fixed">

            <!-- ===== 标题栏 ===== -->

            💡 DeepSeek-V4-Flash · 多剧本版
        </div>

    <!-- ===== 剧本编辑模态框 ===== -->

        <div class="modal-box">

            <input type="text" id="scriptNameInput" placeholder="如：中世纪奇幻" />

            <textarea id="scriptPromptInput" placeholder="你是一个中世纪奇幻世界的主持人..."></textarea>
            <label>开场白（初始场景）</label>

    <!-- ===== 剧本列表模态框 ===== -->
